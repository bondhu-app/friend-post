name: friend_post
description: Friend Post - A social media app for connecting with friends, sharing posts, photos, comments, likes and more.
publish_to: 'none'
version: 1.0.0+1

environment:
sdk: ">=3.4.0 <4.0.0"

dependencies:
flutter: {sdk: flutter}
cupertino_icons: ^1.0.8
firebase_core: ^4.0.0
firebase_auth: ^6.0.1
cloud_firestore: ^6.0.0
firebase_storage: ^13.0.0
google_mobile_ads: ^6.0.0
image_picker: ^1.1.2
provider: ^6.1.5+1
cached_network_image: ^3.4.1
intl: ^0.20.2

dev_dependencies:
flutter_test: {sdk: flutter}
flutter_lints: ^6.0.0

flutter:
uses-material-design: true
