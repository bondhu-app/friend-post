name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check environment
        run: |
          set -e
          flutter --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Get dependencies
        run: flutter pub get

      # ============================================================
      # BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase configuration
        run: |
          set -e

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."

      # ============================================================
      # REBUILD ANDROID
      # ============================================================

      - name: Rebuild Android project
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          echo "Fresh Android project created."

      # ============================================================
      # CONFIGURE SETTINGS.GRADLE.KTS
      # ============================================================

      - name: Configure Android plugins
        run: |
          set -e

          SETTINGS="android/settings.gradle.kts"

          if [ ! -f "$SETTINGS" ]; then
            echo "ERROR: $SETTINGS not found."
            exit 1
          fi

          echo "Original settings.gradle.kts:"
          cat "$SETTINGS"

          # Kotlin plugin
          sed -i \
            's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "2.3.0" apply false/' \
            "$SETTINGS"

          # Android Gradle Plugin
          sed -i \
            's/id("com.android.application") version "[^"]*" apply false/id("com.android.application") version "8.9.1" apply false/' \
            "$SETTINGS"

          # Google Services plugin
          if ! grep -q 'com.google.gms.google-services' "$SETTINGS"; then
            sed -i \
              '/plugins {/a\    id("com.google.gms.google-services") version "4.4.3" apply false' \
              "$SETTINGS"
          else
            sed -i \
              's/id("com.google.gms.google-services") version "[^"]*" apply false/id("com.google.gms.google-services") version "4.4.3" apply false/' \
              "$SETTINGS"
          fi

          echo ""
          echo "Updated settings.gradle.kts:"
          cat "$SETTINGS"

      # ============================================================
      # CONFIGURE APP BUILD.GRADLE.KTS
      # ============================================================

      - name: Configure Android app
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          if [ ! -f "$APP" ]; then
            echo "ERROR: $APP not found."
            exit 1
          fi

          echo "Configuring applicationId..."

          sed -i \
            's/applicationId = "[^"]*"/applicationId = "com.friendpost.app"/' \
            "$APP"

          # Add Google Services plugin if missing.
          if ! grep -q 'id("com.google.gms.google-services")' "$APP"; then
            sed -i \
              '/plugins {/a\    id("com.google.gms.google-services")' \
              "$APP"
          fi

          # ========================================================
          # REMOVE OLD KOTLIN OPTIONS
          # ========================================================

          sed -i '/kotlinOptions {/,+2d' "$APP"

          # ========================================================
          # REMOVE OLD KOTLIN COMPILER OPTIONS
          # ========================================================

          sed -i '/compilerOptions {/,+5d' "$APP"

          # ========================================================
          # REMOVE OLD KOTLIN TOOLCHAIN
          # ========================================================

          sed -i '/jvmToolchain(17)/d' "$APP"

          # ========================================================
          # FORCE JAVA 17
          # ========================================================

          sed -i '/sourceCompatibility = JavaVersion.VERSION_11/d' "$APP"
          sed -i '/targetCompatibility = JavaVersion.VERSION_11/d' "$APP"

          # If compileOptions exists, replace its values.
          sed -i \
            's/sourceCompatibility = JavaVersion.VERSION_[0-9]*/sourceCompatibility = JavaVersion.VERSION_17/' \
            "$APP"

          sed -i \
            's/targetCompatibility = JavaVersion.VERSION_[0-9]*/targetCompatibility = JavaVersion.VERSION_17/' \
            "$APP"

          # ========================================================
          # ADD JAVA 17 + KOTLIN TOOLCHAIN
          # ========================================================

          cat >> "$APP" <<'EOF'

          // ==========================================================
          // Friend Post JVM configuration
          // ==========================================================

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          echo ""
          echo "Final android/app/build.gradle.kts:"
          cat "$APP"

      # ============================================================
      # VERIFY APPLICATION ID
      # ============================================================

      - name: Verify Firebase package
        run: |
          set -e

          echo "Checking applicationId..."

          grep -q \
            'applicationId = "com.friendpost.app"' \
            android/app/build.gradle.kts

          echo "Checking Firebase package..."

          grep -q \
            '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo ""
          echo "SUCCESS: Firebase package matches."

      # ============================================================
      # VERIFY KOTLIN
      # ============================================================

      - name: Verify Kotlin configuration
        run: |
          set -e

          echo "Checking Kotlin plugin..."

          grep -q \
            'id("org.jetbrains.kotlin.android") version "2.3.0" apply false' \
            android/settings.gradle.kts

          echo ""
          echo "SUCCESS: Kotlin 2.3.0 configured."

      # ============================================================
      # VERIFY JVM
      # ============================================================

      - name: Verify JVM 17 configuration
        run: |
          set -e

          echo "Checking Java target..."

          grep -q \
            'sourceCompatibility = JavaVersion.VERSION_17' \
            android/app/build.gradle.kts

          grep -q \
            'targetCompatibility = JavaVersion.VERSION_17' \
            android/app/build.gradle.kts

          echo "Checking Kotlin toolchain..."

          grep -q \
            'jvmToolchain(17)' \
            android/app/build.gradle.kts

          echo ""
          echo "========================================"
          echo "JVM CONFIGURATION OK"
          echo "========================================"
          echo "Java target   : 17"
          echo "Kotlin target : 17"

      # ============================================================
      # CHECK V1 EMBEDDING
      # ============================================================

      - name: Check Android V1 embedding
        run: |
          set -e

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo "ERROR: Legacy Android V1 embedding found."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."

      # ============================================================
      # VERIFY ANDROID FILES
      # ============================================================

      - name: Verify Android project
        run: |
          set -e

          test -f android/gradlew
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/google-services.json

          echo "Android project verification passed."

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        run: |
          set -e

          flutter clean
          flutter pub get

      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Analyze project
        run: flutter analyze

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build release APK
        run: |
          set -e

          echo "
