name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # ============================================================
      # REBUILD ANDROID PROJECT
      # ============================================================

      - name: Rebuild Android project from Flutter V2 template
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Rebuilding Android project"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json android/app/google-services.json

          echo "Fresh Flutter Android project created."

          # Remove generated test directory.
          rm -rf test

          echo "Generated test directory removed."

      # ============================================================
      # FORCE COMPATIBLE KOTLIN / GRADLE CONFIGURATION
      # ============================================================

      - name: Configure Android Gradle and Kotlin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Android Gradle"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists():
              raise SystemExit(
                  "ERROR: android/settings.gradle.kts not found."
              )

          if not app.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found."
              )

          settings_text = settings.read_text()
          app_text = app.read_text()

          # ----------------------------------------------------------
          # Kotlin Gradle Plugin
          #
          # IMPORTANT:
          # Flutter's generated Android project may contain an older
          # Kotlin version. Force Kotlin 2.1.20 here.
          # ----------------------------------------------------------

          kotlin_pattern = (
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+'
              r'version\s+"[^"]+"\s+apply\s+false'
          )

          kotlin_replacement = (
              'id("org.jetbrains.kotlin.android") '
              'version "2.1.20" apply false'
          )

          settings_text, kotlin_count = re.subn(
              kotlin_pattern,
              kotlin_replacement,
              settings_text,
              count=1,
          )

          if kotlin_count == 0:
              marker = 'id("dev.flutter.flutter-plugin-loader")'

              index = settings_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter plugin loader not found in "
                      "settings.gradle.kts."
                  )

              end = settings_text.find("\n", index)

              if end == -1:
                  end = len(settings_text)

              settings_text = (
                  settings_text[:end + 1]
                  + '    id("org.jetbrains.kotlin.android") '
                    'version "2.1.20" apply false\n'
                  + settings_text[end + 1:]
              )

          # ----------------------------------------------------------
          # Android Gradle Plugin
          # ----------------------------------------------------------

          agp_pattern = (
              r'id\("com\.android\.application"\)\s+'
              r'version\s+"[^"]+"\s+apply\s+false'
          )

          agp_replacement = (
              'id("com.android.application") '
              'version "8.9.1" apply false'
          )

          settings_text, agp_count = re.subn(
              agp_pattern,
              agp_replacement,
              settings_text,
              count=1,
          )

          if agp_count == 0:
              marker = 'id("dev.flutter.flutter-plugin-loader")'

              index = settings_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter plugin loader not found "
                      "for Android plugin configuration."
                  )

              end = settings_text.find("\n", index)

              if end == -1:
                  end = len(settings_text)

              settings_text = (
                  settings_text[:end + 1]
                  + '    id("com.android.application") '
                    'version "8.9.1" apply false\n'
                  + settings_text[end + 1:]
              )

          # ----------------------------------------------------------
          # Google Services plugin
          # ----------------------------------------------------------

          google_pattern = (
              r'id\("com\.google\.gms\.google-services"\)\s+'
              r'version\s+"[^"]+"\s+apply\s+false'
          )

          google_replacement = (
              'id("com.google.gms.google-services") '
              'version "4.4.3" apply false'
          )

          settings_text, google_count = re.subn(
              google_pattern,
              google_replacement,
              settings_text,
              count=1,
          )

          if google_count == 0:
              marker = 'id("dev.flutter.flutter-plugin-loader")'

              index = settings_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter plugin loader not found "
                      "for Google Services configuration."
                  )

              end = settings_text.find("\n", index)

              if end == -1:
                  end = len(settings_text)

              settings_text = (
                  settings_text[:end + 1]
                  + '    id("com.google.gms.google-services") '
                    'version "4.4.3" apply false\n'
                  + settings_text[end + 1:]
              )

          # ----------------------------------------------------------
          # Application ID
          # ----------------------------------------------------------

          app_text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.friendpost.app"',
              app_text,
              count=1,
          )

          # ----------------------------------------------------------
          # Add Google Services plugin to app module
          # ----------------------------------------------------------

          if 'id("com.google.gms.google-services")' not in app_text:

              marker = 'id("dev.flutter.flutter-gradle-plugin")'

              index = app_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter Gradle plugin not found "
                      "in app/build.gradle.kts."
                  )

              end = app_text.find("\n", index)

              if end == -1:
                  end = len(app_text)

              app_text = (
                  app_text[:end + 1]
                  + '    id("com.google.gms.google-services")\n'
                  + app_text[end + 1:]
              )

          settings.write_text(settings_text)
          app.write_text(app_text)

          print("")
          print("========================================")
          print("Android configuration completed")
          print("========================================")
          print("")
          print("Kotlin Gradle Plugin : 2.1.20")
          print("Android Gradle Plugin: 8.9.1")
          print("Google Services      : 4.4.3")
          print("Application ID       : com.friendpost.app")
          print("")
          PY

      # ============================================================
      # VERIFY KOTLIN CONFIGURATION
      # ============================================================

      - name: Verify Kotlin configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Kotlin configuration"
          echo "========================================"

          echo ""
          echo "settings.gradle.kts:"
          cat android/settings.gradle.kts

          echo ""
          echo "Checking Kotlin plugin..."

          grep -q \
            'id("org.jetbrains.kotlin.android") version "2.1.20" apply false' \
            android/settings.gradle.kts

          echo ""
          echo "SUCCESS: Kotlin 2.1.20 is configured."

      # ============================================================
      # CONFIGURE ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package and Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Android package"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app/build.gradle.kts")
          settings = Path("android/settings.gradle.kts")

          app_text = app.read_text()
          settings_text = settings.read_text()

          # Firebase package:
          #
          # com.friendpost.app
          #
          # Android applicationId must match Firebase.

          old_id = 'applicationId = "com.friendpost.friend_post"'
          new_id = 'applicationId = "com.friendpost.app"'

          if old_id in app_text:
              app_text = app_text.replace(
                  old_id,
                  new_id,
                  1,
              )
          elif 'applicationId = "com.friendpost.app"' not in app_text:
              raise SystemExit(
                  "ERROR: Could not configure applicationId."
              )

          # Make sure Google Services plugin exists.
          if 'id("com.google.gms.google-services")' not in app_text:

              marker = 'id("dev.flutter.flutter-gradle-plugin")'

              index = app_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter Gradle plugin not found."
                  )

              end = app_text.find("\n", index)

              if end == -1:
                  end = len(app_text)

              app_text = (
                  app_text[:end + 1]
                  + '    id("com.google.gms.google-services")\n'
                  + app_text[end + 1:]
              )

          # Make sure Google Services plugin version exists.
          if 'id("com.google.gms.google-services")' not in settings_text:

              marker = 'id("dev.flutter.flutter-plugin-loader")'

              index = settings_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter plugin loader not found."
                  )

              end = settings_text.find("\n", index)

              if end == -1:
                  end = len(settings_text)

              settings_text = (
                  settings_text[:end + 1]
                  + '    id("com.google.gms.google-services") '
                    'version "4.4.3" apply false\n'
                  + settings_text[end + 1:]
              )

          app.write_text(app_text)
          settings.write_text(settings_text)

          print("Android applicationId: com.friendpost.app")
          print("Google Services configured.")
          PY

      # ============================================================
      # VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase package configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Firebase package"
          echo "========================================"

          echo ""
          echo "Android applicationId:"
          grep "applicationId" android/app/build.gradle.kts

          echo ""
          echo "Firebase package:"
          grep -n '"package_name"' \
            android/app/google-services.json

          echo ""
          echo "Checking package match..."

          grep -q \
            'applicationId = "com.friendpost.app"' \
            android/app/build.gradle.kts

          grep -q \
            '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo ""
          echo "SUCCESS: Android and Firebase package names match."

      # ============================================================
      # CHECK LEGACY ANDROID V1
      # ============================================================

      - name: Check for legacy Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking for Android V1 embedding"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding found."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."

      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Android project"
          echo "========================================"

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/google-services.json

          echo ""
          echo "Android project verification passed."

      # ============================================================
      # ANALYZE FLUTTER PROJECT
      # ============================================================

      - name: Analyze project
        run: flutter analyze

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build release APK
        run: flutter build apk --release

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "Checking APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESS"
          echo ""

          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
