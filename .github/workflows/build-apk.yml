name: Build Friend Post APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create or repair Flutter project
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FRIEND POST FLUTTER PROJECT"
          echo "========================================"

          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml missing."
            echo "Creating Flutter project..."

            flutter create \
              --project-name friend_post \
              --org com.friendpost \
              .
          else
            echo "pubspec.yaml found."
          fi

      - name: Verify pubspec
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PUBSPEC"
          echo "========================================"

          test -f pubspec.yaml

          echo "pubspec.yaml found."

      - name: Add required Firebase packages
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE DEPENDENCIES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Repair Android project
        run: |
          set -e

          echo "========================================"
          echo "REPAIRING ANDROID PROJECT"
          echo "========================================"

          if [ ! -f "android/gradlew" ] || \
             [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Android Gradle files are missing."
            echo "Regenerating Flutter Android project files..."

            mkdir -p /tmp/friend_post_backup

            cp -r lib /tmp/friend_post_backup/lib

            if [ -f "pubspec.yaml" ]; then
              cp pubspec.yaml /tmp/friend_post_backup/pubspec.yaml
            fi

            flutter create \
              --platforms=android \
              --project-name friend_post \
              --org com.friendpost \
              .

            cp -r /tmp/friend_post_backup/lib/* lib/

            if [ -f "/tmp/friend_post_backup/pubspec.yaml" ]; then
              cp /tmp/friend_post_backup/pubspec.yaml pubspec.yaml
            fi

          else
            echo "Android Gradle files already exist."
          fi

      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew is missing."
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties are missing."
            exit 1
          fi

          echo "android/gradlew: OK"
          echo "gradle-wrapper.properties: OK"

          chmod +x android/gradlew

      - name: Check Firebase configuration
        run: |
          set -e

          echo "========================================"
          echo "CHECKING FIREBASE CONFIGURATION"
          echo "========================================"

          if [ ! -f "lib/firebase_options.dart" ]; then
            echo "ERROR: lib/firebase_options.dart is missing."
            exit 1
          fi

          echo "firebase_options.dart: OK"

      - name: Check Google Services
        run: |
          set -e

          echo "========================================"
          echo "CHECKING GOOGLE SERVICES"
          echo "========================================"

          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json: FOUND"
          else
            echo "WARNING: android/app/google-services.json not found."
            echo "Firebase Android initialization may require this file."
          fi

      - name: Flutter pub get
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

      - name: Flutter analyze
        run: |
          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRIEND POST APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL"
          echo ""

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
