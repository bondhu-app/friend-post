name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # FLUTTER VERSION
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PROJECT STRUCTURE"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
            "android/app/google-services.json"
            "android/app/build.gradle.kts"
            "android/settings.gradle.kts"
            "android/build.gradle.kts"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Project structure verification passed."


      # ============================================================
      # CREATE GRADLE WRAPPER IF MISSING
      # ============================================================

      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ENSURING GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew is missing."
            echo "Generating Android project wrapper..."

            cd android

            gradle wrapper --gradle-version 8.14

            cd ..
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew still missing."
            exit 1
          fi

          chmod +x android/gradlew

          echo "OK: android/gradlew"


      # ============================================================
      # VERIFY PUBSPEC
      # ============================================================

      - name: Verify pubspec configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PUBSPEC"
          echo "========================================"

          grep -q '^name: friend_post' pubspec.yaml
          grep -q 'firebase_core:' pubspec.yaml
          grep -q 'firebase_auth:' pubspec.yaml
          grep -q 'cloud_firestore:' pubspec.yaml
          grep -q 'firebase_storage:' pubspec.yaml
          grep -q 'google_mobile_ads:' pubspec.yaml

          echo "pubspec configuration verified."


      # ============================================================
      # VERIFY FIREBASE JSON
      # ============================================================

      - name: Verify Firebase JSON
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE JSON"
          echo "========================================"

          FIREBASE="android/app/google-services.json"

          test -f "$FIREBASE"

          grep -q '"project_id": "friend-post-fbfdd"' "$FIREBASE"
          grep -q '"package_name": "com.friendpost.app"' "$FIREBASE"
          grep -q '"mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a"' "$FIREBASE"

          echo "Firebase project ID: friend-post-fbfdd"
          echo "Firebase package: com.friendpost.app"
          echo "Firebase Android App ID verified."


      # ============================================================
      # VERIFY FIREBASE OPTIONS
      # ============================================================

      - name: Verify firebase_options.dart
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE OPTIONS"
          echo "========================================"

          FILE="lib/firebase_options.dart"

          test -f "$FILE"

          grep -q 'class DefaultFirebaseOptions' "$FILE"
          grep -q 'FirebaseOptions' "$FILE"
          grep -q 'friend-post-fbfdd' "$FILE"
          grep -q '1074705827775' "$FILE"
          grep -q '68710467504787bc3a430a' "$FILE"
          grep -q 'AIzaSyAbYCTMxhCJzft1dgnpHDRkbC4v9RMU4GE' "$FILE"

          echo "firebase_options.dart verified."


      # ============================================================
      # VERIFY MAIN DART
      # ============================================================

      - name: Verify main.dart
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING MAIN.DART"
          echo "========================================"

          FILE="lib/main.dart"

          test -f "$FILE"

          grep -q 'firebase_core/firebase_core.dart' "$FILE"
          grep -q 'firebase_options.dart' "$FILE"
          grep -q 'Firebase.initializeApp' "$FILE"
          grep -q 'DefaultFirebaseOptions.currentPlatform' "$FILE"

          echo "main.dart verified."


      # ============================================================
      # VERIFY ANDROID PACKAGE
      # ============================================================

      - name: Verify Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PACKAGE"
          echo "========================================"

          GRADLE_FILE="android/app/build.gradle.kts"
          FIREBASE_FILE="android/app/google-services.json"

          echo ""
          echo "Using Gradle file:"
          echo "$GRADLE_FILE"

          echo ""
          echo "Searching for package..."

          grep -n 'namespace' "$GRADLE_FILE" || true
          grep -n 'applicationId' "$GRADLE_FILE" || true

          echo ""
          echo "Verifying namespace..."

          if ! grep -Fq 'namespace = "com.friendpost.app"' "$GRADLE_FILE"; then
            echo "ERROR: namespace is not com.friendpost.app"
            exit 1
          fi

          echo "OK: namespace = com.friendpost.app"

          echo ""
          echo "Verifying application ID..."

          if ! grep -Fq 'applicationId = "com.friendpost.app"' "$GRADLE_FILE"; then
            echo "ERROR: applicationId is not com.friendpost.app"
            exit 1
          fi

          echo "OK: applicationId = com.friendpost.app"

          echo ""
          echo "Verifying Firebase package..."

          if ! grep -Fq '"package_name": "com.friendpost.app"' "$FIREBASE_FILE"; then
            echo "ERROR: Firebase package_name does not match."
            exit 1
          fi

          echo "OK: Firebase package_name = com.friendpost.app"

          echo ""
          echo "Android package verification passed."


      # ============================================================
      # CHECK ANDROID V1 EMBEDDING
      # ============================================================

      - name: Check Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID V1 EMBEDDING"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView' \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding detected."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."


      # ============================================================
      # VERIFY GRADLE VERSION
      # ============================================================

      - name: Verify Gradle version
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GRADLE"
          echo "========================================"

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

          grep -n 'distributionUrl' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle wrapper verified."


      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GETTING DEPENDENCIES"
          echo "========================================"

          flutter pub get

          echo ""
          echo "Dependencies installed successfully."


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Flutter project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          flutter clean
          flutter pub get

          echo ""
          echo "Clean completed."


      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Run Flutter analyze
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

          echo ""
          echo "Flutter analyze completed successfully."


      # ============================================================
      #
