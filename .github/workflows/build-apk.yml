name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Rebuild Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Rebuilding Android project"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          rm -rf test

          echo "Fresh Android project created."

      - name: Configure Android Gradle and Kotlin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Android Gradle and Kotlin"
          echo "========================================"

          SETTINGS=""

          if [ -f "android/settings.gradle" ]; then
            SETTINGS="android/settings.gradle"
          elif [ -f "android/settings.gradle.kts" ]; then
            SETTINGS="android/settings.gradle.kts"
          else
            echo "ERROR: Android settings.gradle file not found."
            exit 1
          fi

          APP="android/app/build.gradle"

          if [ ! -f "$APP" ]; then
            APP="android/app/build.gradle.kts"
          fi

          echo "Settings file: $SETTINGS"
          echo "App Gradle file: $APP"

          python3 - "$SETTINGS" "$APP" <<'PY'
          from pathlib import Path
          import re
          import sys

          settings_path = Path(sys.argv[1])
          app_path = Path(sys.argv[2])

          settings = settings_path.read_text()
          app = app_path.read_text()

          # ----------------------------------------------------------
          # Kotlin plugin
          # ----------------------------------------------------------

          kotlin_pattern = re.compile(
              r'id\s*["\']org\.jetbrains\.kotlin\.android["\']'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false'
          )

          kotlin_replacement = (
              'id "org.jetbrains.kotlin.android" '
              'version "2.1.20" apply false'
          )

          if kotlin_pattern.search(settings):
              settings = kotlin_pattern.sub(
                  kotlin_replacement,
                  settings,
                  count=1,
              )
          else:
              plugin_marker = re.search(
                  r'plugins\s*\{',
                  settings,
              )

              if not plugin_marker:
                  raise SystemExit(
                      "ERROR: plugins block not found in "
                      + str(settings_path)
                  )

              insert_at = plugin_marker.end()

              settings = (
                  settings[:insert_at]
                  + '\n'
                  + '    id "org.jetbrains.kotlin.android" '
                    'version "2.1.20" apply false'
                  + settings[insert_at:]
              )

          # ----------------------------------------------------------
          # Android Gradle Plugin
          # ----------------------------------------------------------

          agp_pattern = re.compile(
              r'id\s*["\']com\.android\.application["\']'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false'
          )

          agp_replacement = (
              'id "com.android.application" '
              'version "8.9.1" apply false'
          )

          if agp_pattern.search(settings):
              settings = agp_pattern.sub(
                  agp_replacement,
                  settings,
                  count=1,
              )

          # ----------------------------------------------------------
          # Google Services
          # ----------------------------------------------------------

          google_pattern = re.compile(
              r'id\s*["\']com\.google\.gms\.google-services["\']'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false'
          )

          google_replacement = (
              'id "com.google.gms.google-services" '
              'version "4.4.3" apply false'
          )

          if google_pattern.search(settings):
              settings = google_pattern.sub(
                  google_replacement,
                  settings,
                  count=1,
              )
          else:
              plugin_marker = re.search(
                  r'plugins\s*\{',
                  settings,
              )

              if not plugin_marker:
                  raise SystemExit(
                      "ERROR: plugins block not found for "
                      "Google Services."
                  )

              insert_at = plugin_marker.end()

              settings = (
                  settings[:insert_at]
                  + '\n'
                  + '    id "com.google.gms.google-services" '
                    'version "4.4.3" apply false'
                  + settings[insert_at:]
              )

          # ----------------------------------------------------------
          # Firebase application ID
          # ----------------------------------------------------------

          app = re.sub(
              r'applicationId\s*[=:]\s*["\'][^"\']+["\']',
              'applicationId "com.friendpost.app"',
              app,
              count=1,
          )

          # ----------------------------------------------------------
          # Google Services plugin in app module
          # ----------------------------------------------------------

          if (
              'com.google.gms.google-services' not in app
          ):
              plugin_marker = re.search(
                  r'plugins\s*\{',
                  app,
              )

              if not plugin_marker:
                  raise SystemExit(
                      "ERROR: plugins block not found in app Gradle."
                  )

              insert_at = plugin_marker.end()

              app = (
                  app[:insert_at]
                  + '\n'
                  + '    id "com.google.gms.google-services"'
                  + app[insert_at:]
              )

          settings_path.write_text(settings)
          app_path.write_text(app)

          print("")
          print("========================================")
          print("Android configuration completed")
          print("========================================")
          print("Kotlin Plugin : 2.1.20")
          print("Android Plugin: 8.9.1")
          print("Google Service: 4.4.3")
          print("Application ID: com.friendpost.app")
          print("")
          PY

      - name: Show final Android configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINAL ANDROID CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Settings files:"
          ls -la android/settings.gradle* || true

          echo ""
          echo "Kotlin plugin:"
          grep -n \
            "org.jetbrains.kotlin.android" \
            android/settings.gradle* || true

          echo ""
          echo "Android plugin:"
          grep -n \
            "com.android.application" \
            android/settings.gradle* || true

          echo ""
          echo "Google Services:"
          grep -n \
            "google-services" \
            android/settings.gradle* || true

          echo ""
          echo "Application ID:"
          grep -n \
            "applicationId" \
            android/app/build.gradle* || true

      - name: Verify Firebase package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Firebase package"
          echo "========================================"

          grep -q \
            'com.friendpost.app' \
            android/app/build.gradle*

          grep -q \
            '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo "SUCCESS: Firebase package matches."

      - name: Check for legacy Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Android V1 embedding"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding found."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/google-services.json

          echo "Android project verification passed."

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
