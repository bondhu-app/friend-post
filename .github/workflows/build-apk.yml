name: Build Friend Post APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Verify Flutter project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FRIEND POST PROJECT"
          echo "========================================"

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "ERROR: lib directory is missing."
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart is missing."
            exit 1
          fi

          echo "pubspec.yaml: OK"
          echo "lib/: OK"
          echo "lib/main.dart: OK"

      - name: Add Firebase dependencies
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE DEPENDENCIES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Generate missing Android project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          if [ ! -f "android/gradlew" ] || \
             [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Android project files are missing."
            echo "Generating Android files..."

            mkdir -p /tmp/friend_post_backup

            cp -r lib /tmp/friend_post_backup/lib

            flutter create \
              --platforms=android \
              --project-name friend_post \
              --org com.friendpost \
              .

            rm -rf lib
            cp -r /tmp/friend_post_backup/lib lib

          else
            echo "Android project already exists."
          fi

      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew is missing."
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          fi

          echo "android/gradlew: OK"
          echo "gradle-wrapper.properties: OK"

          chmod +x android/gradlew

      - name: Check Firebase options
        run: |
          set -e

          echo "========================================"
          echo "CHECKING FIREBASE OPTIONS"
          echo "========================================"

          if [ ! -f "lib/firebase_options.dart" ]; then
            echo "ERROR: lib/firebase_options.dart is missing."
            exit 1
          fi

          echo "firebase_options.dart: OK"

      - name: Create Google Services configuration
        run: |
          set -e

          echo "========================================"
          echo "CHECKING GOOGLE SERVICES"
          echo "========================================"

          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json already exists."
          else
            echo "google-services.json is missing."
            echo "Creating configuration from Firebase project..."

            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1074705827775",
              "project_id": "friend-post-fbfdd",
              "storage_bucket": "friend-post-fbfdd.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a",
                  "android_client_info": {
                    "package_name": "com.friendpost.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAbYCTMxhCJzft1dgnpHDRkbC4v9RMU4GE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                },
                "configuration_version": "1"
              }
            ]
          }
          EOF

            echo "google-services.json created."
          fi

      - name: Configure Android Firebase plugin
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING FIREBASE ANDROID PLUGIN"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          content = settings.read_text()

          if "com.google.gms.google-services" not in content:
              content = content.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                  1
              )
              settings.write_text(content)

          app_gradle = Path("android/app/build.gradle")
          content = app_gradle.read_text()

          if "com.google.gms.google-services" not in content:
              content = content.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )
              app_gradle.write_text(content)

          print("Firebase Android plugin configured.")
          PY

      - name: Flutter pub get
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

      - name: Flutter analyze
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRIEND POST APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
