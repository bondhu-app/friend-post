name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Rebuild Android project from Flutter V2 template
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Rebuilding Android project"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json android/app/google-services.json

          echo "Fresh Flutter V2 Android project created."

          # flutter create generates a default test/widget_test.dart.
          # It belongs to the temporary template, not this application.
          rm -rf test

          echo "Generated template test directory removed."

      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Google Services"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          settings_text = settings.read_text()
          app_text = app.read_text()

          google_services_version = '    id("com.google.gms.google-services") version "4.4.3" apply false'

          if "com.google.gms.google-services" not in settings_text:
              marker = '    id("dev.flutter.flutter-plugin-loader")'
              index = settings_text.find(marker)

              if index != -1:
                  end = settings_text.find("\n", index)
                  settings_text = (
                      settings_text[:end + 1]
                      + google_services_version
                      + "\n"
                      + settings_text[end + 1:]
                  )
              else:
                  raise SystemExit(
                      "ERROR: Flutter plugin loader not found in settings.gradle.kts"
                  )

              settings.write_text(settings_text)

          if "com.google.gms.google-services" not in app_text:
              marker = '    id("dev.flutter.flutter-gradle-plugin")'
              index = app_text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "ERROR: Flutter Gradle plugin not found in app/build.gradle.kts"
                  )

              end = app_text.find("\n", index)

              app_text = (
                  app_text[:end + 1]
                  + '    id("com.google.gms.google-services")\n'
                  + app_text[end + 1:]
              )

              app.write_text(app_text)

          print("Google Services configuration completed.")
          PY

      - name: Verify Android application configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Android configuration"
          echo "========================================"

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/google-services.json

          echo "Required Android files exist."

          echo ""
          echo "Application configuration:"
          grep -RIn \
            "applicationId\|namespace\|google-services" \
            android/app/build.gradle.kts \
            android/settings.gradle.kts \
            || true

      - name: Check for legacy Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking for Android V1 embedding"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding reference found."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Android project"
          echo "========================================"

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project verification passed."

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "Checking APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
