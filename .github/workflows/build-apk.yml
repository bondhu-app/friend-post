name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 3. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # 4. CHECK FLUTTER
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # 5. CHECK BASIC PROJECT
      # ============================================================

      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING FLUTTER PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "OK: pubspec.yaml"
          echo "OK: lib/main.dart"
          echo "OK: lib/firebase_options.dart"


      # ============================================================
      # 6. REPAIR ANDROID PROJECT
      #
      # If Android files are incomplete, Flutter regenerates them.
      # Existing lib/ and pubspec.yaml are preserved.
      # ============================================================

      - name: Repair Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REPAIRING ANDROID PROJECT"
          echo "========================================"

          NEED_REPAIR=0

          if [ ! -f "android/app/build.gradle.kts" ]; then
            NEED_REPAIR=1
          fi

          if [ ! -f "android/settings.gradle" ]; then
            NEED_REPAIR=1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            NEED_REPAIR=1
          fi

          if [ ! -f "android/gradlew" ]; then
            NEED_REPAIR=1
          fi

          if [ "$NEED_REPAIR" -eq 1 ]; then

            echo ""
            echo "Android project is incomplete."
            echo "Regenerating Android platform files..."

            flutter create \
              --platforms=android \
              --org com.friendpost \
              --project-name friend_post \
              --android-language kotlin \
              .

            echo ""
            echo "Android project regenerated."

          else

            echo ""
            echo "Android project already contains required files."

          fi


      # ============================================================
      # 7. VERIFY ANDROID FILES
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          required_files=(
            "android/app/buildbuild
