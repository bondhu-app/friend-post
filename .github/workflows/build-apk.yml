name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Friend Post Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # FLUTTER VERSION
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # BASIC FILES
      # ============================================================

      - name: Verify basic project files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING BASIC PROJECT FILES"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
            "android/app/google-services.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Basic project files verified."


      # ============================================================
      # BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE CONFIGURATION"
          echo "========================================"

          cp android/app/google-services.json \
            /tmp/google-services.json

          echo "Firebase configuration backed up."


      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GETTING FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter pub get

          echo ""
          echo "Dependencies installed."


      # ============================================================
      # REPAIR ANDROID PROJECT
      # ============================================================

      - name: Repair Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          NEED_REPAIR="false"

          if [ ! -f "android/gradlew" ]; then
            echo "Missing android/gradlew"
            NEED_REPAIR="true"
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Missing Gradle wrapper"
            NEED_REPAIR="true"
          fi

          if [ ! -f "android/settings.gradle.kts" ] && \
             [ ! -f "android/settings.gradle" ]; then
            echo "Missing settings.gradle"
            NEED_REPAIR="true"
          fi

          if [ ! -f "android/app/build.gradle.kts" ] && \
             [ ! -f "android/app/build.gradle" ]; then
            echo "Missing Android app Gradle file"
            NEED_REPAIR="true"
          fi

          if [ "$NEED_REPAIR" = "true" ]; then

            echo ""
            echo "Android project is incomplete."
            echo "Creating a fresh Android project..."

            rm -rf android

            flutter create \
              --platforms=android \
              --org com.friendpost \
              --project-name friend_post \
              --android-language kotlin \
              .

            cp /tmp/google-services.json \
              android/app/google-services.json

            echo ""
            echo "Fresh Android project created."

          else

            echo ""
            echo "Existing Android project is usable."

          fi


      # ============================================================
      # FIX ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PACKAGE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          APP_ID = "com.friendpost.app"
          NAMESPACE = "com.friendpost.app"

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          app_gradle = None

          for candidate in candidates:
              if candidate.exists():
                  app_gradle = candidate
                  break

          if app_gradle is None:
              raise SystemExit(
                  "ERROR: Android app Gradle file not found."
              )

          text = app_gradle.read_text()

          # --------------------------------------------------------
          # applicationId
          # --------------------------------------------------------

          if re.search(r'applicationId\s*=\s*"[^"]+"', text):
              text = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{APP_ID}"',
                  text,
                  count=1,
              )

          elif re.search(r'applicationId\s+"[^"]+"', text):
              text = re.sub(
                  r'applicationId\s+"[^"]+"',
                  f'applicationId "{APP_ID}"',
                  text,
                  count=1,
              )

          else:
              android_match = re.search(
                  r'(?m)^\s*android\s*\{',
                  text,
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + f'\n    namespace = "{NAMESPACE}"'
                  + f'\n    defaultConfig {{'
                  + f'\n        applicationId = "{APP_ID}"'
                  + f'\n    }}'
                  + text[insert_at:]
              )

          # --------------------------------------------------------
          # namespace
          # --------------------------------------------------------

          if re.search(r'namespace\s*=\s*"[^"]+"', text):
              text = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  f'namespace = "{NAMESPACE}"',
                  text,
                  count=1,
              )

          elif re.search(r'namespace\s+"[^"]+"', text):
              text = re.sub(
                  r'namespace\s+"[^"]+"',
                  f'namespace "{NAMESPACE}"',
                  text,
                  count=1,
              )

          else:
              android_match = re.search(
                  r'(?m)^\s*android\s*\{',
                  text,
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + f'\n    namespace = "{NAMESPACE}"'
                  + text[insert_at:]
              )

          app_gradle.write_text(text)

          print("Android Gradle file:")
          print(app_gradle)
          print("")
          print("Application ID:", APP_ID)
          print("Namespace:", NAMESPACE)
          PY


      # ============================================================
      # VERIFY ANDROID PACKAGE
      # ============================================================

      - name: Verify Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PACKAGE"
          echo "========================================"

          APP_GRADLE=""

          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            APP_GRADLE="android/app/build.gradle"
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "Using Gradle file:"
          echo "$APP_GRADLE"

          echo ""
          echo "Searching for package..."

          grep -n \
            "com.friendpost.app" \
            "$APP_GRADLE" || true

          echo ""
          echo "Verifying application ID..."

          if ! grep -q \
            "com.friendpost.app" \
            "$APP_GRADLE"; then

            echo ""
            echo "ERROR: com.friendpost.app is not configured."
            echo ""
            cat "$APP_GRADLE"
            exit 1
          fi

          echo ""
          echo "Verifying Firebase package..."

          if ! grep -q \
            '"package_name": "com.friendpost
