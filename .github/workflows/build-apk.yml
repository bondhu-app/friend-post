name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version
          java -version

      # ============================================================
      # BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE CONFIGURATION"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."

      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        run: flutter pub get

      # ============================================================
      # REBUILD ANDROID PROJECT
      # ============================================================

      - name: Rebuild Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REBUILDING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          rm -rf test

          echo ""
          echo "Fresh Flutter Android project created."

      # ============================================================
      # CONFIGURE ANDROID
      # ============================================================

      - name: Configure Android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID"
          echo "========================================"

          if [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: android/settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: android/app/build.gradle.kts not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          settings_path = Path("android/settings.gradle.kts")
          app_path = Path("android/app/build.gradle.kts")

          settings = settings_path.read_text()
          app = app_path.read_text()

          KOTLIN_VERSION = "2.3.0"
          AGP_VERSION = "8.9.1"
          GOOGLE_SERVICES_VERSION = "4.4.3"

          # ==========================================================
          # SETTINGS.GRADLE.KTS
          # ==========================================================

          # Kotlin plugin
          kotlin_pattern = re.compile(
              r'id\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false'
          )

          kotlin_line = (
              '    id("org.jetbrains.kotlin.android") '
              f'version "{KOTLIN_VERSION}" apply false'
          )

          if kotlin_pattern.search(settings):
              settings = kotlin_pattern.sub(
                  kotlin_line,
                  settings,
                  count=1,
              )
          else:
              if "plugins {" not in settings:
                  raise SystemExit(
                      "ERROR: plugins block not found in settings.gradle.kts"
                  )

              settings = settings.replace(
                  "plugins {",
                  "plugins {\n" + kotlin_line,
                  1,
              )

          # Android Gradle Plugin
          agp_pattern = re.compile(
              r'id\(\s*["\']com\.android\.application["\']\s*\)'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false'
          )

          agp_line = (
              '    id("com.android.application") '
              f'version "{AGP_VERSION}" apply false'
          )

          if agp_pattern.search(settings):
              settings = agp_pattern.sub(
                  agp_line,
                  settings,
                  count=1,
              )
          else:
              if "plugins {" not in settings:
                  raise SystemExit(
                      "ERROR: plugins block not found for AGP"
                  )

              settings = settings.replace(
                  "plugins {",
                  "plugins {\n" + agp_line,
                  1,
              )

          # Google Services
          google_pattern = re.compile(
              r'id\(\s*["\']com\.google\.gms\.google-services["\']\s*\)'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false'
          )

          google_line = (
              '    id("com.google.gms.google-services") '
              f'version "{GOOGLE_SERVICES_VERSION}" apply false'
          )

          if google_pattern.search(settings):
              settings = google_pattern.sub(
                  google_line,
                  settings,
                  count=1,
              )
          else:
              settings = settings.replace(
                  "plugins {",
                  "plugins {\n" + google_line,
                  1,
              )

          settings_path.write_text(settings)

          # ==========================================================
          # APP BUILD.GRADLE.KTS
          # ==========================================================

          # Application ID
          app = re.sub(
              r'applicationId\s*=\s*["\'][^"\']+["\']',
              'applicationId = "com.friendpost.app"',
              app,
              count=1,
          )

          # Google Services plugin
          if 'id("com.google.gms.google-services")' not in app:
              if "plugins {" not in app:
                  raise SystemExit(
                      "ERROR: app plugins block not found"
                  )

              app = app.replace(
                  "plugins {",
                  "plugins {\n"
                  '    id("com.google.gms.google-services")',
                  1,
              )

          app_path.write_text(app)

          print("")
          print("========================================")
          print("ANDROID CONFIGURATION COMPLETE")
          print("========================================")
          print(f"Kotlin Plugin : {KOTLIN_VERSION}")
          print(f"Android Plugin: {AGP_VERSION}")
          print(f"Google Service: {GOOGLE_SERVICES_VERSION}")
          print("Application ID: com.friendpost.app")
          print("========================================")
          PY

      # ============================================================
      # VERIFY KOTLIN
      # ============================================================

      - name: Verify Kotlin configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING KOTLIN"
          echo "========================================"

          echo ""
          echo "Kotlin plugin configuration:"
          grep -n \
            "org.jetbrains.kotlin.android" \
            android/settings.gradle.kts

          echo ""

          if grep -q \
            'id("org.jetbrains.kotlin.android") version "2.3.0" apply false' \
            android/settings.gradle.kts; then

            echo "SUCCESS: Kotlin 2.3.0 configured."

          else

            echo "ERROR: Kotlin 2.3.0 NOT found."
            exit 1

          fi

      # ============================================================
      # VERIFY AGP
      # ============================================================

      - name: Verify Android Gradle Plugin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID GRADLE PLUGIN"
          echo "========================================"

          grep -n \
            "com.android.application" \
            android/settings.gradle.kts

          echo ""
          echo "AGP configuration verified."

      # ============================================================
      # VERIFY GOOGLE SERVICES
      # ============================================================

      - name: Verify Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GOOGLE SERVICES"
          echo "========================================"

          grep -n \
            "google.gms.google-services" \
            android/settings.gradle.kts

          grep -n \
            "google.gms.google-services" \
            android/app/build.gradle.kts

          echo ""
          echo "Google Services plugin verified."

      # ============================================================
      # VERIFY FIREBASE PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE PACKAGE"
          echo "========================================"

          echo ""
          echo "Android application ID:"
          grep -n \
            "applicationId" \
            android/app/build.gradle.kts

          echo ""
          echo "Firebase package:"
          grep -n \
            '"package_name"' \
            android/app/google-services.json

          echo ""

          grep -q \
            'applicationId = "com.friendpost.app"' \
            android/app/build.gradle.kts

          grep -q \
            '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo "SUCCESS: Firebase and Android package match."

      # ============================================================
      # VERIFY GRADLE WRAPPER
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GRADLE WRAPPER"
          echo "========================================"

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle distribution:"
          grep \
            "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle wrapper verified."

      # ============================================================
      # CHECK V1 EMBEDDING
      # ============================================================

      - name: Check Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID V1 EMBEDDING"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding found."
            exit 1
          fi

          echo ""
          echo "SUCCESS: No Android V1 embedding found."

      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -f android/gradlew
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/google-services.json

          echo ""
          echo "Android project verification passed."

      # ============================================================
      # FLUTTER ANALYZE
      # ============================================================

      - name: Analyze project
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean Flutter build
        run: |
          set -e

          echo "========================================"
          echo "CLEANING BUILD"
          echo "========================================"

          flutter clean
          flutter pub get

      # ============================================================
      # FINAL CONFIGURATION CHECK
      # ============================================================

      - name: Final Kotlin check before build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINAL KOTLIN CHECK"
          echo "========================================"

          echo ""
          echo "settings.gradle.kts:"
          cat android/settings.gradle.kts

          echo ""
          echo "Kotlin plugin:"
          grep \
            "org.jetbrains.kotlin.android" \
            android/settings.gradle.kts

          echo ""

          if ! grep -q \
            'version "2.3.0" apply false' \
            android/settings.gradle.kts; then

            echo "ERROR: Kotlin 2.3.0 is not active."
            exit 1
          fi

          echo "SUCCESS: Kotlin 2.3.0 is active before build."

      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter build apk --release

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
