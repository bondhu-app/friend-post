name: Build Friend Post APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FRIEND POST PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart

          echo "Flutter project: OK"

      - name: Prepare Android project
        run: |
          set -e

          echo "========================================"
          echo "PREPARING ANDROID PROJECT"
          echo "========================================"

          if [ ! -d "android" ] || \
             [ ! -f "android/settings.gradle" ] || \
             [ ! -f "android/app/build.gradle" ]; then

            echo "Android project is missing."
            echo "Generating Android project..."

            TEMP_DIR=$(mktemp -d)

            cd "$TEMP_DIR"

            flutter create \
              --platforms=android \
              --project-name friend_post \
              --org com.friendpost \
              friend_post_project

            cd "$GITHUB_WORKSPACE"

            rm -rf android
            cp -r "$TEMP_DIR/friend_post_project/android" android

            rm -rf "$TEMP_DIR"

            echo "Android project generated successfully."

          else
            echo "Android project already exists."
          fi

      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "android/: OK"
          echo "settings.gradle: OK"
          echo "app/build.gradle: OK"
          echo "gradlew: OK"
          echo "Gradle wrapper: OK"

      - name: Add Firebase dependencies
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE DEPENDENCIES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

          flutter pub get

      - name: Configure Firebase Android plugin
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING FIREBASE ANDROID PLUGIN"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app_gradle = Path("android/app/build.gradle")

          settings_content = settings.read_text()
          app_content = app_gradle.read_text()

          # Add Google Services plugin to settings.gradle
          if "com.google.gms.google-services" not in settings_content:
              if "plugins {" in settings_content:
                  settings_content = settings_content.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1
                  )
              else:
                  settings_content = (
                      "pluginManagement {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "        gradlePluginPortal()\n"
                      "    }\n"
                      "}\n\n"
                      "plugins {\n"
                      "    id 'com.android.application' version '8.9.1' apply false\n"
                      "    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false\n"
                      "    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'\n"
                      "    id 'com.google.gms.google-services' version '4.4.4' apply false\n"
                      "}\n\n"
                      + settings_content
                  )

              settings.write_text(settings_content)

          # Add Google Services plugin to app build.gradle
          if "com.google.gms.google-services" not in app_content:
              if "plugins {" in app_content:
                  app_content = app_content.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )
              else:
                  app_content = (
                      "plugins {\n"
                      "    id 'com.android.application'\n"
                      "    id 'org.jetbrains.kotlin.android'\n"
                      "    id 'dev.flutter.flutter-gradle-plugin'\n"
                      "    id 'com.google.gms.google-services'\n"
                      "}\n\n"
                      + app_content
                  )

              app_gradle.write_text(app_content)

          print("Firebase Gradle plugin configured.")
          PY

      - name: Create Google Services configuration
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          mkdir -p android/app

          if [ ! -f "android/app/google-services.json" ]; then

            cat > android/app/google-services.json <<'EOF'
