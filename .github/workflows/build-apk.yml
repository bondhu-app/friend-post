name: Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter source
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FRIEND POST SOURCE"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "pubspec.yaml: OK"
          echo "lib/main.dart: OK"
          echo "lib/firebase_options.dart: OK"

      - name: Generate Android project
        run: |
          set -e

          echo "========================================"
          echo "GENERATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name friend_post \
            --org com.friendpost \
            .

          echo ""
          echo "Android project generated."

          test -d android
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Android Kotlin DSL project: OK"

      - name: Configure Android application
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID APPLICATION"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              'namespace = "com.friendpost.friend_post"',
              'namespace = "com.friendpost.app"'
          )

          text = text.replace(
              'namespace = "com.example.friend_post"',
              'namespace = "com.friendpost.app"'
          )

          text = text.replace(
              'applicationId = "com.friendpost.friend_post"',
              'applicationId = "com.friendpost.app"'
          )

          text = text.replace(
              'applicationId = "com.example.friend_post"',
              'applicationId = "com.friendpost.app"'
          )

          path.write_text(text)

          print("Android application configured.")
          PY
