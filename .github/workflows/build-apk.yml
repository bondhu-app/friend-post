name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # ============================================================
      # CHECK ENVIRONMENT
      # ============================================================

      - name: Check Flutter and Java
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        run: flutter pub get

      # ============================================================
      # BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR:"
            echo "android/app/google-services.json was not found."
            exit 1
          fi

          cp \
            android/app/google-services.json \
            /tmp/google-services.json

          echo "Firebase configuration backed up."

      # ============================================================
      # REMOVE OLD ANDROID
      # ============================================================

      - name: Remove old Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REMOVING OLD ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          echo "Old Android project removed."

      # ============================================================
      # CREATE FRESH FLUTTER ANDROID PROJECT
      # ============================================================

      - name: Create fresh Flutter Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING FRESH ANDROID PROJECT"
          echo "========================================"

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          echo "Fresh Flutter Android project created."

      # ============================================================
      # RESTORE FIREBASE
      # ============================================================

      - name: Restore Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RESTORING FIREBASE"
          echo "========================================"

          mkdir -p android/app

          cp \
            /tmp/google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration restored."

      # ============================================================
      # CONFIGURE ANDROID
      # ============================================================

      - name: Configure Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          settings_path = Path("android/settings.gradle.kts")
          app_path = Path("android/app/build.gradle.kts")

          if not settings_path.exists():
              raise SystemExit(
                  "ERROR: android/settings.gradle.kts not found."
              )

          if not app_path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found."
              )

          settings = settings_path.read_text()
          app = app_path.read_text()

          # ==========================================================
          # VERSIONS
          # ==========================================================

          KOTLIN_VERSION = "2.3.0"
          AGP_VERSION = "8.9.1"
          GOOGLE_SERVICES_VERSION = "4.4.3"

          # ==========================================================
          # SETTINGS.GRADLE.KTS
          # ==========================================================

          # Remove existing Kotlin plugin declaration.
          settings = re.sub(
              r'^\s*id\s*["\']org\.jetbrains\.kotlin\.android["\']\s*'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false\s*$',
              '',
              settings,
              flags=re.MULTILINE,
          )

          # Remove existing Android application plugin declaration.
          settings = re.sub(
              r'^\s*id\s*["\']com\.android\.application["\']\s*'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false\s*$',
              '',
              settings,
              flags=re.MULTILINE,
          )

          # Remove existing Google Services plugin declaration.
          settings = re.sub(
              r'^\s*id\s*["\']com\.google\.gms\.google-services["\']\s*'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false\s*$',
              '',
              settings,
              flags=re.MULTILINE,
          )

          # Find plugins block.
          plugins_match = re.search(
              r'plugins\s*\{',
              settings,
          )

          if not plugins_match:
              raise SystemExit(
                  "ERROR: plugins block not found in settings.gradle.kts."
              )

          plugins_start = plugins_match.end()

          plugin_lines = f'''
              id("com.android.application") version "{AGP_VERSION}" apply false
              id("org.jetbrains.kotlin.android") version "{KOTLIN_VERSION}" apply false
              id("com.google.gms.google-services") version "{GOOGLE_SERVICES_VERSION}" apply false
          '''

          settings =
