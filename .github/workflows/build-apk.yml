name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and Verify Friend Post APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # CHECK FLUTTER
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # VERIFY DART FILES
      # ============================================================

      - name: Verify Dart project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING DART PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "OK: pubspec.yaml"
          echo "OK: lib/main.dart"
          echo "OK: lib/firebase_options.dart"


      # ============================================================
      # BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."


      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GETTING DEPENDENCIES"
          echo "========================================"

          flutter pub get

          echo "Dependencies installed successfully."


      # ============================================================
      # RECREATE ANDROID
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RECREATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not created."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: android/app/build.gradle.kts was not created."
            exit 1
          fi

          if [ ! -f "android/build.gradle.kts" ]; then
            echo "ERROR: android/build.gradle.kts was not created."
            exit 1
          fi

          if [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: android/settings.gradle.kts was not created."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not created."
            exit 1
          fi

          cp /tmp/google-services.json \
            android/app/google-services.json

          chmod +x android/gradlew

          echo "Android project recreated successfully."


      # ============================================================
      # CONFIGURE ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PACKAGE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]*"',
              'namespace = "com.friendpost.app"',
              text,
              count=1,
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]*"',
              'applicationId = "com.friendpost.app"',
              text,
              count=1,
          )

          path.write_text(text)

          print("namespace = com.friendpost.app")
          print("applicationId = com.friendpost.app")
          PY


      # ============================================================
      # CONFIGURE GOOGLE SERVICES
      # ============================================================

      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          settings_path = Path("android/settings.gradle.kts")
          settings_text = settings_path.read_text()

          google_plugin = (
              '    id("com.google.gms.google-services") '
              'version "4.4.3" apply false\n'
          )

          if 'id("com.google.gms.google-services")' not in settings_text:
              if "plugins {" not in settings_text:
                  raise SystemExit(
                      "ERROR: plugins block not found in settings.gradle.kts"
                  )

              settings_text = settings_text.replace(
                  "plugins {\n",
                  "plugins {\n" + google_plugin,
                  1,
              )

          settings_path.write_text(settings_text)

          app_path = Path("android/app/build.gradle.kts")
          app_text = app_path.read_text()

          app_plugin = '    id("com.google.gms.google-services")\n'

          if 'id("com.google.gms.google-services")' not in app_text:
              if "plugins {" not in app_text:
                  raise SystemExit(
                      "ERROR: plugins block not found in app/build.gradle.kts"
                  )

              app_text = app_text.replace(
                  "plugins {\n",
                  "plugins {\n" + app_plugin,
                  1,
              )

          app_path.write_text(app_text)

          print("Google Services configured successfully.")
          PY


      # ============================================================
      # CONFIGURE JAVA 17 / KOTLIN 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING JAVA 17"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # ----------------------------------------------------------
          # REMOVE OLD kotlinOptions BLOCK
          # ----------------------------------------------------------

          kotlin_options_pattern = re.compile(
              r'(?ms)^[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}'
          )

          text = kotlin_options_pattern.sub("", text)

          # ----------------------------------------------------------
          # REMOVE OLD compileOptions BLOCK
          # ----------------------------------------------------------

          compile_options_pattern = re.compile(
              r'(?ms)^[ \t]*compileOptions\s*\{.*?\n[ \t]*\}'
          )

          text = compile_options_pattern.sub("", text)

          # ----------------------------------------------------------
          # FIND android BLOCK
          # IMPORTANT:
          # re.search() MUST receive text.
          # ----------------------------------------------------------

          android
