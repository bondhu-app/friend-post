name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # FLUTTER VERSION
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # VERIFY BASIC FLUTTER FILES
      # ============================================================

      - name: Verify Flutter project files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FLUTTER PROJECT"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Flutter project files verified."


      # ============================================================
      # BACKUP FIREBASE JSON
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE CONFIGURATION"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            echo ""
            echo "The Firebase JSON file is required."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."


      # ============================================================
      # REBUILD ANDROID PROJECT
      #
      # IMPORTANT:
      # The repository currently does not contain
      # android/app/build.gradle.kts.
      #
      # Therefore we recreate the Android project here.
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RECREATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: Flutter did not create android/app/build.gradle.kts"
            exit 1
          fi

          if [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Flutter did not create android/settings.gradle.kts"
            exit 1
          fi

          if [ ! -f "android/build.gradle.kts" ]; then
            echo "ERROR: Flutter did not create android/build.gradle.kts"
            exit 1
          fi

          cp /tmp/google-services.json \
            android/app/google-services.json

          echo ""
          echo "Android project recreated successfully."
          echo "Firebase configuration restored."


      # ============================================================
      # CONFIGURE ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PACKAGE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.friendpost.app"',
              text,
              count=1,
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.friendpost.app"',
              text,
              count=1,
          )

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )

          path.write_text(text)

          print("Application ID: com.friendpost.app")
          print("Namespace: com.friendpost.app")
          print("Google Services plugin: enabled")
          PY


      # ============================================================
      # CONFIGURE GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          text = path.read_text()

          plugin_line = (
              '    id("com.google.gms.google-services") '
              'version "4.4.2" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              if "plugins {" in text:
                  text = text.replace(
                      "plugins {",
                      "plugins {\n" + plugin_line,
                      1,
                  )
              else:
                  text = (
                      "pluginManagement {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "        gradlePluginPortal()\n"
                      "    }\n"
                      "}\n\n"
                      "plugins {\n"
                      + plugin_line
                      + "\n}\n\n"
                      + text
                  )

          path.write_text(text)

          print("Google Services plugin configured.")
          PY


      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          required_files=(
            "android/app/build.gradle.kts"
            "android/settings.gradle.kts"
            "android/build.gradle.kts"
            "android/gradlew"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/google-services.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Android project verification passed."


      # ============================================================
      # VERIFY PUBSPEC
      # ============================================================

      - name: Verify pubspec configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PUBSPEC"
          echo "========================================"

          grep -q "^name: friend_post" pubspec.yaml
          grep -q "firebase_core:" pubspec.yaml
          grep -q "firebase_auth:" pubspec.yaml
          grep -q "cloud_firestore:" pubspec.yaml
          grep -q "firebase_storage:" pubspec.yaml
          grep -q "google_mobile_ads:" pubspec.yaml

          echo "pubspec configuration verified."


      # ============================================================
      # VERIFY FIREBASE JSON
      # ============================================================

      - name: Verify Firebase JSON
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE JSON"
          echo "========================================"

          FIREBASE="android/app/google-services.json"

          grep -q '"project_id": "friend-post-fbfdd"' "$FIREBASE"
          grep -q '"package_name": "com.friendpost.app"' "$FIREBASE"
          grep -q '"mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a"' "$FIREBASE"

          echo "Firebase project ID verified."
          echo "Firebase package verified."
          echo "Firebase Android App ID verified."


      # ============================================================
      # VERIFY FIREBASE OPTIONS
      # ============================================================

      - name: Verify firebase_options.dart
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE OPTIONS"
          echo "========================================"

          FILE="lib/firebase_options.dart"

          grep -q "class DefaultFirebaseOptions" "$FILE"
          grep -q "FirebaseOptions" "$FILE"
          grep -q "friend-post-fbfdd" "$FILE"
          grep -q "1074705827775" "$FILE"
          grep -q "68710467504787bc3a430a" "$FILE"
          grep -q "AIzaSyAbYCTMxhCJ8xft1dgnpHDRkbC4v9RMU4GE" "$FILE" || \
          grep -q "AIzaSyAbYCTMxhCJzft1dgnpHDRkbC4v9RMU4GE" "$FILE"
          grep -q "TargetPlatform.fuchsia" "$FILE"

          echo "firebase_options.dart verified."


      # ============================================================
      # VERIFY MAIN DART
      # ============================================================

      - name: Verify main.dart Firebase initialization
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING MAIN.DART"
          echo "========================================"

          FILE="lib/main.dart"

          grep -q "firebase_core/firebase_core.dart" "$FILE"
          grep -q "firebase_options.dart" "$FILE"
          grep -q "Firebase.initializeApp" "$FILE"
          grep -q "DefaultFirebaseOptions.currentPlatform" "$FILE"

          echo "main.dart Firebase initialization verified."


      # ============================================================
      # VERIFY ANDROID PACKAGE
      # ============================================================

      - name: Verify Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PACKAGE"
          echo "========================================"

          grep -q 'applicationId = "com.friendpost.app"' \
            android/app/build.gradle.kts

          grep -q 'namespace = "com.friendpost.app"' \
            android/app/build.gradle.kts

          grep -q '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo ""
          echo "Android package: com.friendpost.app"
          echo "Android package verification passed."


      # ============================================================
      # CHECK ANDROID V1 EMBEDDING
      # ============================================================

      - name: Check Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID V1 EMBEDDING"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding detected."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."


      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GETTING DEPENDENCIES"
          echo "========================================"

          flutter pub get

          echo ""
          echo "Dependencies installed successfully."


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Flutter project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          flutter clean
          flutter pub get

          echo ""
          echo "Clean completed."


      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Run Flutter analyze
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

          echo ""
          echo "Flutter analyze completed successfully."


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter build apk --release

          echo ""
          echo "Release APK build completed."


      # ============================================================
      # VERIFY APK FILE
      # ============================================================

      - name: Verify APK file
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK FILE"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not created."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size looks invalid: $SIZE bytes"
            exit 1
          fi

          echo "APK exists."
          echo "APK size: $SIZE bytes"

          ls -lh "$APK"


      # ============================================================
      # VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK PACKAGE"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name "aapt" \
            -type f \
            | sort \
            | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt

          cat /tmp/apk-badging.txt

          grep -q "package: name='com.friendpost.app'" \
            /tmp/apk-badging.txt

          echo ""
          echo "APK package verification passed."


      # ============================================================
      # VERIFY LAUNCHER
      # ============================================================

      - name: Verify APK launcher activity
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK LAUNCHER"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name "aapt" \
            -type f \
            | sort \
            | tail -n 1)

          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt

          if ! grep -q "launchable-activity" \
            /tmp/apk-badging.txt; then

            echo "ERROR: Launcher activity was not found."
            exit 1
          fi

          echo "Launcher activity found."

          grep "launchable-activity" \
            /tmp/apk-badging.txt


      # ============================================================
      # APK SHA256
      # ============================================================

      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATING APK SHA256"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          sha256sum "$APK" | tee \
            build/app/outputs/flutter-apk/app-release.apk.sha256

          echo ""
          echo "Checksum generated."


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error


      # ============================================================
      # FINAL SUCCESS
      # ============================================================

      - name: Build verification summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "FRIEND POST APK BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "Flutter: verified"
          echo "Android project: recreated"
          echo "Firebase: verified"
          echo "Android package: verified"
          echo "V1 embedding: verified"
          echo "Dependencies: installed"
          echo "Flutter analyze: passed"
          echo "APK: created"
          echo "APK package: verified"
          echo "Launcher: verified"
          echo "SHA256: generated"
          echo ""
          echo "APK is ready."
