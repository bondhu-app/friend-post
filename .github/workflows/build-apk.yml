name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Friend Post Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 3. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # 4. CHECK FLUTTER
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # 5. VERIFY BASIC FILES
      # ============================================================

      - name: Verify basic project files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING BASIC PROJECT FILES"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
            "android/app/google-services.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Basic files verified."


      # ============================================================
      # 6. REMOVE OLD TEST FILES
      # ============================================================

      - name: Remove old test files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REMOVING OLD TEST FILES"
          echo "========================================"

          rm -rf test

          echo "Old test files removed."


      # ============================================================
      # 7. BACKUP FIREBASE
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE CONFIGURATION"
          echo "========================================"

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."


      # ============================================================
      # 8. GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GETTING FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter pub get

          echo "Dependencies installed."


      # ============================================================
      # 9. REBUILD ANDROID PROJECT
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RECREATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          cp /tmp/google-services.json \
             android/app/google-services.json

          echo ""
          echo "Android project recreated successfully."


      # ============================================================
      # 10. CONFIGURE ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PACKAGE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.friendpost.app"',
              text,
              count=1,
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.friendpost.app"',
              text,
              count=1,
          )

          path.write_text(text)

          print("namespace = com.friendpost.app")
          print("applicationId = com.friendpost.app")
          PY

          echo "Android package configured."


      # ============================================================
      # 11. CONFIGURE GOOGLE SERVICES
      # ============================================================

      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )

          path.write_text(text)

          print("Google Services plugin configured.")
          PY


      # ============================================================
      # 12. CONFIGURE KOTLIN / JAVA 17
      # ============================================================

      - name: Configure Java 17 and Kotlin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING JAVA 17"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # Remove old compileOptions blocks.
          def remove_block(source, name):
              pattern = re.compile(
                  rf'(?m)^[ \t]*{re.escape(name)}\s*\{{'
              )

              while True:
                  match = pattern.search(source)

                  if not match:
                      return source

                  start = match.start()
                  brace_start = source.find("{", match.start())

                  depth = 0
                  end = None

                  for i in range(brace_start, len(source)):
                      if source[i] == "{":
                          depth += 1
                      elif source[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  if end is None:
                      raise RuntimeError(
                          f"Could not parse {name} block"
                      )

                  source = source[:start] + source[end:]

          text = remove_block(text, "compileOptions")

          # Remove old kotlinOptions blocks.
          text = remove_block(text, "kotlinOptions")

          # Add Java 17 inside android block.
          android_match = re.search(
              r'(?m)^android\s*\{',
              text
          )

          if not android_match:
              raise RuntimeError(
                  "android block not found"
              )

          android_open = text.find(
              "{",
              android_match.start()
          )

          depth = 0
          android_end = None

          for i in range(android_open, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      android_end = i
                      break

          if android_end is None:
              raise RuntimeError(
                  "android block end not found"
              )

          compile_options = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          text = (
              text[:android_end]
              + compile_options
              + text[android_end:]
          )

          # Kotlin compilerOptions DSL.
          if "jvmToolchain(17)" not in text:
              text += """

          kotlin {
              jvmToolchain(17)
          }
          """

          path.write_text(text)

          print("Java source compatibility: 17")
          print("Java target compatibility: 17")
          print("Kotlin JVM toolchain: 17")
          PY

          echo "Java/Kotlin configuration completed."


      # ============================================================
      # 13. CONFIGURE KOTLIN PLUGIN VERSION
      # ============================================================

      - name: Configure Kotlin Gradle plugin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING KOTLIN GRADLE PLUGIN"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          text = path.read_text()

          # Flutter 3.35 compatible Kotlin plugin.
          kotlin_version = "2.2.0"

          pattern = (
              r'id\(\s*"org\.jetbrains\.kotlin\.android"\s*\)'
              r'\s+version\s+"[^"]+"\s+apply\s+false'
          )

          replacement = (
              'id("org.jetbrains.kotlin.android") '
              f'version "{kotlin_version}" apply false'
          )

          text = re.sub(
              pattern,
              replacement,
              text
          )

          if 'id("org.jetbrains.kotlin.android")' not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n"
                  f'    {replacement}',
                  1
              )

          path.write_text(text)

          print(
              "Kotlin Gradle plugin:",
              kotlin_version
          )
          PY

          echo "Kotlin plugin configured."


      # ============================================================
      # 14. VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE"
          echo "========================================"

          FIREBASE="android/app/google-services.json"

          grep -q '"project_id": "friend-post-fbfdd"' "$FIREBASE"
          grep -q '"package_name": "com.friendpost.app"' "$FIREBASE"

          echo "Firebase project verified."
          echo "Firebase Android package verified."


      # ============================================================
      # 15. VERIFY ANDROID FILES
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          required_files=(
            "android/gradlew"
            "android/settings.gradle.kts"
            "android/build.gradle.kts"
            "android/app/build.gradle.kts"
            "android/app/src/main/AndroidManifest.xml"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/google-services.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Android project verified."


      # ============================================================
      # 16. CHECK ANDROID V1 EMBEDDING
      # ============================================================

      - name: Check Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID V1 EMBEDDING"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding found."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."


      # ============================================================
      # 17. SHOW ANDROID CONFIGURATION
      # ============================================================

      - name: Show Android configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID CONFIGURATION"
          echo "========================================"

          echo ""
          echo "----- settings.gradle.kts -----"
          cat android/settings.gradle.kts

          echo ""
          echo "----- app/build.gradle.kts -----"
          cat android/app/build.gradle.kts


      # ============================================================
      # 18. CLEAN
      # ============================================================

      - name: Clean Flutter project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          flutter clean
          flutter pub get

          echo "Project cleaned."


      # ============================================================
      # 19. FLUTTER ANALYZE
      # ============================================================

      - name: Run Flutter analyze
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

          echo ""
          echo "Flutter analyze completed successfully."


      # ============================================================
      # 20. BUILD APK
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter build apk --release

          echo ""
          echo "Release APK build completed."


      # ============================================================
      # 21. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "APK exists."
          echo "APK size: $SIZE bytes."

          ls -lh "$APK"


      # ============================================================
      # 22. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK PACKAGE"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt \
            -type f \
            | sort \
            | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt

          cat /tmp/apk-badging.txt

          grep -q "package: name='com.friendpost.app'" \
            /tmp/apk-badging.txt

          echo ""
          echo "APK package verified."


      # ============================================================
      # 23. VERIFY LAUNCHER
      # ============================================================

      - name: Verify APK launcher
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK LAUNCHER"
          echo "========================================"

          grep -q "launchable-activity" \
            /tmp/apk-badging.txt

          echo "Launcher activity verified."


      # ============================================================
      # 24. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATING APK SHA256"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          sha256sum "$APK" | tee \
            build/app/outputs/flutter-apk/app-release.apk.sha256

          echo ""
          echo "SHA256 generated."


      # ============================================================
      # 25. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error


      # ============================================================
      # 26. FINAL SUCCESS
      # ============================================================

      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "FRIEND POST APK BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "Flutter: OK"
          echo "Firebase: OK"
          echo "Android: OK"
          echo "Kotlin: OK"
          echo "Java 17: OK"
          echo "Flutter analyze: OK"
          echo "APK: OK"
          echo "APK package: OK"
          echo "Launcher: OK"
          echo "SHA256: OK"
          echo ""
          echo "APK is ready."
