name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Friend Post APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      # ============================================================
      # VERIFY DART PROJECT
      # ============================================================

      - name: Verify Dart project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING DART PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "OK: pubspec.yaml"
          echo "OK: lib/main.dart"
          echo "OK: lib/firebase_options.dart"

      # ============================================================
      # BACKUP FIREBASE JSON
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP FIREBASE CONFIGURATION"
          echo "========================================"

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."

      # ============================================================
      # GET DEPENDENCIES
      # ============================================================

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GETTING FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter pub get

          echo "Dependencies installed."

      # ============================================================
      # RECREATE ANDROID PROJECT
      #
      # This fixes missing:
      # android/gradlew
      # android/app/build.gradle.kts
      # android/build.gradle.kts
      # AndroidManifest.xml
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RECREATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew was not created."
            exit 1
          fi

          if [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: android/app/build.gradle.kts was not created."
            exit 1
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml was not created."
            exit 1
          fi

          cp /tmp/google-services.json \
            android/app/google-services.json

          chmod +x android/gradlew

          echo "Fresh Android project created successfully."

      # ============================================================
      # CONFIGURE ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PACKAGE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]*"',
              'namespace = "com.friendpost.app"',
              text,
              count=1,
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]*"',
              'applicationId = "com.friendpost.app"',
              text,
              count=1,
          )

          path.write_text(text)

          print("namespace = com.friendpost.app")
          print("applicationId = com.friendpost.app")
          PY

      # ============================================================
      # CONFIGURE GOOGLE SERVICES
      # ============================================================

      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          settings_text = settings.read_text()

          plugin_line = (
              '    id("com.google.gms.google-services") '
              'version "4.4.3" apply false\n'
          )

          if 'id("com.google.gms.google-services")' not in settings_text:
              if "plugins {" in settings_text:
                  settings_text = settings_text.replace(
                      "plugins {\n",
                      "plugins {\n" + plugin_line,
                      1,
                  )
              else:
                  settings_text = (
                      "plugins {\n"
                      + plugin_line
                      + "}\n\n"
                      + settings_text
                  )

          settings.write_text(settings_text)

          app = Path("android/app/build.gradle.kts")
          app_text = app.read_text()

          app_plugin = '    id("com.google.gms.google-services")\n'

          if 'id("com.google.gms.google-services")' not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace(
                      "plugins {\n",
                      "plugins {\n" + app_plugin,
                      1,
                  )
              else:
                  raise SystemExit(
                      "ERROR: plugins block not found in app/build.gradle.kts"
                  )

          app.write_text(app_text)

          print("Google Services plugin configured.")
          PY

      # ============================================================
      # CONFIGURE JAVA 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING JAVA 17"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # Remove old compileOptions blocks.
          pattern = re.compile(
              r'(?ms)^\s*compileOptions\s*\{.*?\n\s*\}'
          )

          text = pattern.sub("", text, count=1)

          # Remove old kotlinOptions blocks.
          pattern = re.compile(
              r'(?ms)^\s*kotlinOptions\s*\{.*?\n\s*\}'
          )

          text = pattern.sub("", text, count=1)

          android_match = re.search(
              r'(?m)^android\s*\{'
          )

          if not android_match:
              raise SystemExit(
                  "ERROR: android block not found."
              )

          start = android_match.start()
          open_brace = text.find("{", start)

          depth = 0
          close_brace = None

          for i in range(open_brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break

          if close_brace is None:
              raise SystemExit(
                  "ERROR: Could not find end of android block."
              )

          compile_options = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          text = (
              text[:close_brace]
              + compile_options
              + "\n"
              + text[close_brace:]
          )

          # Kotlin compilerOptions DSL.
          if "jvmToolchain(17)" not in text:
              text += """

          kotlin {
              jvmToolchain(17)
          }
          """

          path.write_text(text)

          print("Java sourceCompatibility: 17")
          print("Java targetCompatibility: 17")
          print("Kotlin JVM toolchain: 17")
          PY

      # ============================================================
      # VERIFY ANDROID FILES
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          required_files=(
            "android/gradlew"
            "android/settings.gradle.kts"
            "android/build.gradle.kts"
            "android/app/build.gradle.kts"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/google-services.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Android project verification passed."

      # ============================================================
      # VERIFY PACKAGE
      # ============================================================

      - name: Verify Android package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PACKAGE"
          echo "========================================"

          APP_GRADLE="android/app/build.gradle.kts"

          grep -q 'namespace = "com.friendpost.app"' "$APP_GRADLE"
          grep -q 'applicationId = "com.friendpost.app"' "$APP_GRADLE"

          grep -q '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo "Namespace: com.friendpost.app"
          echo "Application ID: com.friendpost.app"
          echo "Firebase package: com.friendpost.app"

          echo "Android package verification passed."

      # ============================================================
      # VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE"
          echo "========================================"

          FIREBASE="android/app/google-services.json"

          grep -q '"project_id": "friend-post-fbfdd"' "$FIREBASE"

          grep -q \
            '"mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a"' \
            "$FIREBASE"

          grep -q \
            '"package_name": "com.friendpost.app"' \
            "$FIREBASE"

          echo "Firebase project: friend-post-fbfdd"
          echo "Firebase Android app verified."

      # ============================================================
      # VERIFY FIREBASE OPTIONS
      # ============================================================

      - name: Verify Firebase Options
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE OPTIONS"
          echo "========================================"

          FILE="lib/firebase_options.dart"

          grep -q "class DefaultFirebaseOptions" "$FILE"
          grep -q "FirebaseOptions" "$FILE"
          grep -q "friend-post-fbfdd" "$FILE"
          grep -q "1074705827775" "$FILE"
          grep -q "68710467504787bc3a430a" "$FILE"
          grep -q "TargetPlatform.fuchsia" "$FILE"

          echo "Firebase options verified."

      # ============================================================
      # VERIFY MAIN
      # ============================================================

      - name: Verify main.dart
        shell: bash
        run: |
          set -e
