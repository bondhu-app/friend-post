name: Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show repository
        run: |
          set -e

          echo "========================================"
          echo "FRIEND POST REPOSITORY"
          echo "========================================"

          pwd
          echo ""

          echo "Root files:"
          ls -la

          echo ""
          echo "Workflow:"
          ls -la .github/workflows || true

      - name: Verify source
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING SOURCE"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "pubspec.yaml FOUND"
          echo "lib/main.dart FOUND"

      - name: Generate Android project
        run: |
          set -e

          echo "========================================"
          echo "GENERATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name friend_post \
            --org com.friendpost \
            .

          echo ""
          echo "Android project generated."

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo ""
          echo "ANDROID PROJECT READY"

      - name: Configure application ID
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING APPLICATION ID"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text = text.replace(
              "com.example.friend_post",
              "com.friendpost.app"
          )

          p.write_text(text)

          print("Application ID configured.")
          PY

      - name: Configure Firebase
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING FIREBASE"
          echo "========================================"

          mkdir -p android/app

          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1074705827775",
              "project_id": "friend-post-fbfdd",
              "storage_bucket": "friend-post-fbfdd.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a",
                  "android_client_info": {
                    "package_name": "com.friendpost.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAbYCTMxhCJzft1dgnpHDRkbC4v9RMU4GE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                },
                "configuration_version": "1"
              }
            ]
          }
          EOF

          echo "google-services.json created."

      - name: Configure Google Services plugin
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          s = settings.read_text()
          a = app.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                  1
              )

          if "com.google.gms.google-services" not in a:
              a = a.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )

          settings.write_text(s)
          app.write_text(a)

          print("Google Services configured.")
          PY

      - name: Add Firebase packages
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE PACKAGES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

          flutter pub get

      - name: Verify Firebase options
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE OPTIONS"
          echo "========================================"

          test -f lib/firebase_options.dart

          echo "firebase_options.dart FOUND"

      - name: Flutter analyze
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRIEND POST APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
