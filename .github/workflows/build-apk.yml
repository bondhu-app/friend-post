name: Build Friend Post APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check Flutter project
        run: |
          set -e
          echo "Checking Friend Post project..."

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "Flutter project OK."

      - name: Install dependencies
        run: flutter pub get

      - name: Check Firebase configuration
        run: |
          set -e

          if [ ! -f lib/firebase_options.dart ]; then
            echo "ERROR: lib/firebase_options.dart not found."
            echo "Please run flutterfire configure and commit the generated file."
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Check Android project
        run: |
          set -e

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project OK."

      - name: Flutter analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
