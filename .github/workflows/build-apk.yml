name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # ============================================================
      # BACKUP FIREBASE CONFIGURATION
      # ============================================================

      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Backing up Firebase configuration"
          echo "========================================"

          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration backed up."

      # ============================================================
      # REBUILD ANDROID PROJECT
      # ============================================================

      - name: Rebuild Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Rebuilding Android project"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          rm -rf test

          echo "Fresh Android project created."

      # ============================================================
      # CONFIGURE ANDROID
      # ============================================================

      - name: Configure Android Gradle and Kotlin
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Android Gradle and Kotlin"
          echo "========================================"

          if [ -f "android/settings.gradle.kts" ]; then
            SETTINGS="android/settings.gradle.kts"
            DSL="kotlin"
          elif [ -f "android/settings.gradle" ]; then
            SETTINGS="android/settings.gradle"
            DSL="groovy"
          else
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            APP="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            APP="android/app/build.gradle"
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo "Settings file: $SETTINGS"
          echo "App file:      $APP"
          echo "DSL:           $DSL"

          python3 - "$SETTINGS" "$APP" "$DSL" <<'PY'
          from pathlib import Path
          import re
          import sys

          settings_path = Path(sys.argv[1])
          app_path = Path(sys.argv[2])
          dsl = sys.argv[3]

          settings = settings_path.read_text()
          app = app_path.read_text()

          KOTLIN_VERSION = "2.3.0"
          AGP_VERSION = "8.9.1"
          GOOGLE_SERVICES_VERSION = "4.4.3"

          # ==========================================================
          # KOTLIN DSL
          # ==========================================================

          if dsl == "kotlin":

              # ------------------------------------------------------
              # Kotlin plugin
              # ------------------------------------------------------

              kotlin_pattern = re.compile(
                  r'id\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)'
                  r'\s+version\s+["\'][^"\']+["\']'
                  r'\s+apply\s+false'
              )

              kotlin_line = (
                  f'    id("org.jetbrains.kotlin.android") '
                  f'version "{KOTLIN_VERSION}" apply false'
              )

              if kotlin_pattern.search(settings):
                  settings = kotlin_pattern.sub(
                      kotlin_line,
                      settings,
                      count=1,
                  )
              else:
                  if "plugins {" not in settings:
                      raise SystemExit(
                          "ERROR: plugins block not found."
                      )

                  settings = settings.replace(
                      "plugins {",
                      "plugins {\n" + kotlin_line,
                      1,
                  )

              # ------------------------------------------------------
              # Android Gradle Plugin
              # ------------------------------------------------------

              agp_pattern = re.compile(
                  r'id\(\s*["\']com\.android\.application["\']\s*\)'
                  r'\s+version\s+["\'][^"\']+["\']'
                  r'\s+apply\s+false'
              )

              agp_line = (
                  f'    id("com.android.application") '
                  f'version "{AGP_VERSION}" apply false'
              )

              if agp_pattern.search(settings):
                  settings = agp_pattern.sub(
                      agp_line,
                      settings,
                      count=1,
                  )

              # ------------------------------------------------------
              # Google Services
              # ------------------------------------------------------

              google_pattern = re.compile(
                  r'id\(\s*["\']com\.google\.gms\.google-services["\']\s*\)'
                  r'\s+version\s+["\'][^"\']+["\']'
                  r'\s+apply\s+false'
              )

              google_line = (
                  f'    id("com.google.gms.google-services") '
                  f'version "{GOOGLE_SERVICES_VERSION}" apply false'
              )

              if google_pattern.search(settings):
                  settings = google_pattern.sub(
                      google_line,
                      settings,
                      count=1,
                  )
              else:
                  settings = settings.replace(
                      "plugins {",
                      "plugins {\n" + google_line,
                      1,
                  )

              # ------------------------------------------------------
              # Application ID
              # ------------------------------------------------------

              app = re.sub(
                  r'applicationId\s*=\s*["\'][^"\']+["\']',
                  'applicationId = "com.friendpost.app"',
                  app,
                  count=1,
              )

              # ------------------------------------------------------
              # Google Services app plugin
              # ------------------------------------------------------

              if 'id("com.google.gms.google-services")' not in app:

                  if "plugins {" not in app:
                      raise SystemExit(
                          "ERROR: App plugins block not found."
                      )

                  app = app.replace(
                      "plugins {",
                      "plugins {\n"
                      '    id("com.google.gms.google-services")',
                      1,
                  )

          # ==========================================================
          # GROOVY DSL
          # ==========================================================

          else:

              # ------------------------------------------------------
              # Kotlin plugin
              # ------------------------------------------------------

              kotlin_pattern = re.compile(
                  r'id\s+["\']org\.jetbrains\.kotlin\.android["\']'
                  r'\s+version\s+["\'][^"\']+["\']'
                  r'\s+apply\s+false'
              )

              kotlin_line = (
                  f'    id "org.jetbrains.kotlin.android" '
                  f'version "{KOTLIN_VERSION}" apply false'
              )

              if kotlin_pattern.search(settings):
                  settings = kotlin_pattern.sub(
                      kotlin_line,
                      settings,
                      count=1,
                  )
              else:
                  if "plugins {" not in settings:
                      raise SystemExit(
                          "ERROR: plugins block not found."
                      )

                  settings = settings.replace(
                      "plugins {",
                      "plugins {\n" + kotlin_line,
                      1,
                  )

              # ------------------------------------------------------
              # Android Gradle Plugin
              # ------------------------------------------------------

              agp_pattern = re.compile(
                  r'id\s+["\']com\.android\.application["\']'
                  r'\s+version\s+["\'][^"\']+["\']'
                  r'\s+apply\s+false'
              )

              agp_line = (
                  f'    id "com.android.application" '
                  f'version "{AGP_VERSION}" apply false'
              )

              if agp_pattern.search(settings):
                  settings = agp_pattern.sub(
                      agp_line,
                      settings,
                      count=1,
                  )

              # ------------------------------------------------------
              # Google Services
              # ------------------------------------------------------

              google_pattern = re.compile(
                  r'id\s+["\']com\.google\.gms\.google-services["\']'
                  r'\s+version\s+["\'][^"\']+["\']'
                  r'\s+apply\s+false'
              )

              google_line = (
                  f'    id "com.google.gms.google-services" '
                  f'version "{GOOGLE_SERVICES_VERSION}" apply false'
              )

              if google_pattern.search(settings):
                  settings = google_pattern.sub(
                      google_line,
                      settings,
                      count=1,
                  )
              else:
                  settings = settings.replace(
                      "plugins {",
                      "plugins {\n" + google_line,
                      1,
                  )

              # ------------------------------------------------------
              # Application ID
              # ------------------------------------------------------

              app = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  'applicationId "com.friendpost.app"',
                  app,
                  count=1,
              )

              # ------------------------------------------------------
              # Google Services app plugin
              # ------------------------------------------------------

              if "com.google.gms.google-services" not in app:

                  if "plugins {" not in app:
                      raise SystemExit(
                          "ERROR: App plugins block not found."
                      )

                  app = app.replace(
                      "plugins {",
                      "plugins {\n"
                      '    id "com.google.gms.google-services"',
                      1,
                  )

          settings_path.write_text(settings)
          app_path.write_text(app)

          print("")
          print("========================================")
          print("ANDROID CONFIGURATION COMPLETE")
          print("========================================")
          print(f"Kotlin Plugin : {KOTLIN_VERSION}")
          print(f"Android Plugin: {AGP_VERSION}")
          print(
              f"Google Service: {GOOGLE_SERVICES_VERSION}"
          )
          print("Application ID: com.friendpost.app")
          print(f"DSL           : {dsl}")
          print("")
          PY

      # ============================================================
      # FORCE KOTLIN VERSION
      # ============================================================

      - name: Force Kotlin 2.3.0
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Forcing Kotlin 2.3.0"
          echo "========================================"

          if [ -f "android/settings.gradle.kts" ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'id\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") '
              'version "2.3.0" apply false',
              text,
          )

          path.write_text(text)
          PY

          elif [ -f "android/settings.gradle" ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle")
          text = path.read_text()

          text = re.sub(
              r'id\s+["\']org\.jetbrains\.kotlin\.android["\']'
              r'\s+version\s+["\'][^"\']+["\']'
              r'\s+apply\s+false',
              'id "org.jetbrains.kotlin.android" '
              'version "2.3.0" apply false',
              text,
          )

          path.write_text(text)
          PY

          else
            echo "ERROR: No Android settings file found."
            exit 1
          fi

          echo ""
          echo "Kotlin configuration after force:"
          grep -n "org.jetbrains.kotlin.android" \
            android/settings.gradle* || true

      # ============================================================
      # VERIFY CONFIGURATION
      # ============================================================

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Settings:"
          ls -la android/settings.gradle*

          echo ""
          echo "Kotlin:"
          grep -n \
            "org.jetbrains.kotlin.android" \
            android/settings.gradle*

          echo ""
          echo "Android Gradle Plugin:"
          grep -n \
            "com.android.application" \
            android/settings.gradle*

          echo ""
          echo "Google Services:"
          grep -n \
            "google.gms.google-services" \
            android/settings.gradle*

          echo ""
          echo "Application ID:"
          grep -n \
            "applicationId" \
            android/app/build.gradle*

          echo ""

          if grep -q \
            'id("org.jetbrains.kotlin.android") version "2.3.0" apply false' \
            android/settings.gradle.kts 2>/dev/null; then

            echo "SUCCESS: Kotlin 2.3.0 configured."

          elif grep -q \
            'id "org.jetbrains.kotlin.android" version "2.3.0" apply false' \
            android/settings.gradle 2>/dev/null; then

            echo "SUCCESS: Kotlin 2.3.0 configured."

          else

            echo "ERROR: Kotlin 2.3.0 was NOT configured."
            exit 1

          fi

      # ============================================================
      # VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE"
          echo "========================================"

          grep -q \
            'com.friendpost.app' \
            android/app/build.gradle*

          grep -q \
            '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo ""
          echo "SUCCESS: Android and Firebase package names match."

      # ============================================================
      # CHECK LEGACY V1 EMBEDDING
      # ============================================================

      - name: Check for legacy Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID V1 EMBEDDING"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Legacy Android V1 embedding found."
            exit 1
          fi

          echo "SUCCESS: No Android V1 embedding found."

      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/google-services.json

          echo ""
          echo "Android project verification passed."

      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Analyze project
        run: flutter analyze

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build release APK
        run: flutter build apk --release

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "CHECKING APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESS"
          echo ""

          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
