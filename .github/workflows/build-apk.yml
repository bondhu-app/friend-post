name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Friend Post Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PROJECT STRUCTURE"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
            "android/app/google-services.json"
            "android/gradlew"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "OK: android/app/build.gradle.kts"
            echo "ANDROID_GRADLE_FILE=android/app/build.gradle.kts" >> "$GITHUB_ENV"
          elif [ -f "android/app/build.gradle" ]; then
            echo "OK: android/app/build.gradle"
            echo "ANDROID_GRADLE_FILE=android/app/build.gradle" >> "$GITHUB_ENV"
          else
            echo "ERROR: No Android app Gradle file found."
            exit 1
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            echo "OK: android/settings.gradle.kts"
            echo "ANDROID_SETTINGS_FILE=android/settings.gradle.kts" >> "$GITHUB_ENV"
