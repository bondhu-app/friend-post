name: Build Friend Post APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FRIEND POST SOURCE"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "pubspec.yaml: OK"
          echo "lib/main.dart: OK"
          echo "lib/firebase_options.dart: OK"

      - name: Backup application source
        run: |
          set -e

          echo "========================================"
          echo "BACKING UP APPLICATION SOURCE"
          echo "========================================"

          rm -rf /tmp/friend_post_source
          mkdir -p /tmp/friend_post_source

          cp -r lib /tmp/friend_post_source/lib
          cp pubspec.yaml /tmp/friend_post_source/pubspec.yaml

          echo "Application source backed up."

      - name: Generate Flutter Android project
        run: |
          set -e

          echo "========================================"
          echo "GENERATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name friend_post \
            --org com.friendpost \
            .

          echo "Android project generated."

      - name: Restore application source
        run: |
          set -e

          echo "========================================"
          echo "RESTORING APPLICATION SOURCE"
          echo "========================================"

          rm -rf lib
          cp -r /tmp/friend_post_source/lib lib

          cp /tmp/friend_post_source/pubspec.yaml pubspec.yaml

          echo "Application source restored."

      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "android/: OK"
          echo "settings.gradle: OK"
          echo "app/build.gradle: OK"
          echo "gradlew: OK"
          echo "Gradle wrapper: OK"

      - name: Set Android application ID
        run: |
          set -e

          echo "========================================"
          echo "SETTING APPLICATION ID"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "namespace = \"com.example.friend_post\"",
              "namespace = \"com.friendpost.app\""
          )

          text = text.replace(
              'applicationId = "com.example.friend_post"',
              'applicationId = "com.friendpost.app"'
          )

          text = text.replace(
              "namespace = 'com.example.friend_post'",
              "namespace = 'com.friendpost.app'"
          )

          text = text.replace(
              "applicationId 'com.example.friend_post'",
              "applicationId 'com.friendpost.app'"
          )

          path.write_text(text)

          print("Application ID configured.")
          PY

      - name: Configure Firebase Google Services
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING FIREBASE"
          echo "========================================"

          mkdir -p android/app

          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1074705827775",
              "project_id": "friend-post-fbfdd",
              "storage_bucket": "friend-post-fbfdd.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a",
                  "android_client_info": {
                    "package_name": "com.friendpost.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAbYCTMxhCJzft1dgnpHDRkbC4v9RMU4GE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                },
                "configuration_version": "1"
              }
            ]
          }
          EOF

          echo "google-services.json created."

      - name: Configure Google Services Gradle plugin
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES PLUGIN"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          settings_text = settings.read_text()
          app_text = app.read_text()

          if "com.google.gms.google-services" not in settings_text:
              marker = "plugins {"

              if marker in settings_text:
                  settings_text = settings_text.replace(
                      marker,
                      marker + "\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      1
                  )

          if "com.google.gms.google-services" not in app_text:
              marker = "plugins {"

              if marker in app_text:
                  app_text = app_text.replace(
                      marker,
                      marker + "\n    id 'com.google.gms.google-services'",
                      1
                  )

          settings.write_text(settings_text)
          app.write_text(app_text)

          print("Google Services plugin configured.")
          PY

      - name: Add Firebase dependencies
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE DEPENDENCIES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

          flutter pub get

      - name: Verify dependencies
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING DEPENDENCIES"
          echo "========================================"

          grep -q "firebase_core" pubspec.yaml
          grep -q "firebase_auth" pubspec.yaml
          grep -q "cloud_firestore" pubspec.yaml

          echo "Firebase dependencies: OK"

      - name: Flutter analyze
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRIEND POST APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL"
          echo ""

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
