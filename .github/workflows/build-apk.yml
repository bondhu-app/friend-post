name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # FLUTTER VERSION
      # ============================================================

      - name: Check Flutter
        run: flutter --version


      # ============================================================
      # VERIFY BASIC FILES
      # ============================================================

      - name: Verify basic project files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING BASIC PROJECT FILES"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
            "android/app/google-services.json"
            "android/app/build.gradle.kts"
            "android/settings.gradle"
            "android/app/src/main/AndroidManifest.xml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Basic project files verified."


      # ============================================================
      # REPAIR ANDROID GRADLE WRAPPER
      # ============================================================

      - name: Repair Android Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REPAIRING ANDROID GRADLE WRAPPER"
          echo "========================================"

          cd android

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          fi

          echo ""
          echo "Current wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo ""

          if [ -f "./gradlew" ]; then
            echo "gradlew already exists."
          else
            echo "gradlew is missing."
            echo "Generating Gradle wrapper..."

            GRADLE_VERSION=$(grep \
              -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-bin\.zip' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -n 1 \
              | sed -E 's/gradle-([0-9.]+)-bin.zip/\1/')

            if [ -z "$GRADLE_VERSION" ]; then
              echo "Could not determine Gradle version."
              exit 1
            fi

            echo "Detected Gradle version: $GRADLE_VERSION"

            curl -fL \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            mkdir -p /tmp/gradle-dist

            unzip -q \
              /tmp/gradle.zip \
              -d /tmp/gradle-dist

            GRADLE_HOME="/tmp/gradle-dist/gradle-${GRADLE_VERSION}"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              echo "ERROR: Gradle executable was not found."
              exit 1
            fi

            "$GRADLE_HOME/bin/gradle" wrapper \
              --gradle-version "$GRADLE_VERSION"

            echo "Gradle wrapper generated."
          fi

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: android/gradlew could not be created."
            exit 1
          fi

          chmod +x ./gradlew

          echo ""
          echo "SUCCESS: android/gradlew is ready."

          ls -lh ./gradlew


      # ============================================================
      # VERIFY GRADLE WRAPPER
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GRADLE WRAPPER"
          echo "========================================"

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle
