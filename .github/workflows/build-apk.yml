name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # CHECK FLUTTER
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version


      # ============================================================
      # VERIFY PROJECT FILES
      # ============================================================

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PROJECT"
          echo "========================================"

          required_files=(
            "pubspec.yaml"
            "lib/main.dart"
            "lib/firebase_options.dart"
            "android/app/google-services.json"
            "android/app/build.gradle.kts"
            "android/settings.gradle"
            "android/gradlew"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          if [ -f "android/build.gradle.kts" ]; then
            echo "OK: android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then
            echo "OK: android/build.gradle"
          else
            echo "ERROR: Missing Android root Gradle file."
            exit 1
          fi

          echo ""
          echo "PROJECT STRUCTURE VERIFIED."


      # ============================================================
      # MAKE GRADLE EXECUTABLE
      # ============================================================

      - name: Fix Gradle permissions
        shell: bash
        run: |
          set -e

          chmod +x android/gradlew

          echo "Gradle executable permission fixed."


      # ============================================================
      # VERIFY FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE"
          echo "========================================"

          FIREBASE="android/app/google-services.json"

          grep -q '"project_id": "friend-post-fbfdd"' "$FIREBASE"
          grep -q '"package_name": "com.friendpost.app"' "$FIREBASE"
          grep -q '"mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a"' "$FIREBASE"

          echo "Firebase project verified."
          echo "Project ID: friend-post-fbfdd"
          echo "Package: com.friendpost.app"


      # ============================================================
      # VERIFY FIREBASE OPTIONS
      # ============================================================

      - name: Verify firebase_options.dart
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE OPTIONS"
          echo "========================================"

          FILE="lib/firebase_options.dart"

          grep -q "class DefaultFirebaseOptions" "$FILE"
          grep -q "FirebaseOptions" "$FILE"
          grep -q "friend-post-fbfdd" "$FILE"
          grep -q "1074705827775" "$FILE"
          grep -q "68710467504787bc3a430a" "$FILE"
          grep -q "TargetPlatform.fuchsia" "$FILE"

          echo "firebase_options.dart verified."


      # ============================================================
      # VERIFY MAIN.DART
      # ============================================================

      - name: Verify main.dart
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING MAIN.DART"
          echo "========================================"

          FILE="lib/main.dart"

          grep -q "
