name: Build Friend Post APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create missing Flutter project files
        run: |
          set -e

          echo "========================================"
          echo "CREATING FRIEND POST FLUTTER PROJECT"
          echo "========================================"

          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml is missing."
            echo "Creating Flutter project files..."

            flutter create \
              --project-name friend_post \
              --org com.friendpost \
              .

          else
            echo "pubspec.yaml already exists."
          fi

      - name: Check project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING FLUTTER PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f lib/main.dart

          echo "pubspec.yaml: OK"
          echo "lib/: OK"
          echo "android/: OK"
          echo "lib/main.dart: OK"

      - name: Add Firebase packages
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE PACKAGES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth

      - name: Check Firebase configuration
        run: |
          echo "========================================"
          echo "CHECKING FIREBASE CONFIGURATION"
          echo "========================================"

          if [ -f "lib/firebase_options.dart" ]; then
            echo "firebase_options.dart: FOUND"
          else
            echo ""
            echo "WARNING: lib/firebase_options.dart was not found."
            echo ""
            echo "Firebase initialization requires this file."
            echo "The build will stop before APK compilation."
            echo ""
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

      - name: Check Android project
        run: |
          set -e

          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "Android project: OK"
          echo "Gradle wrapper: OK"

      - name: Flutter analyze
        run: |
          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRIEND POST APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
