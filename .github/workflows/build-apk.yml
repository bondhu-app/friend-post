name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Friend Post Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # CHECK FLUTTER
      # ============================================================

      - name: Check Flutter
        run: |
          set -e
          flutter --version
          dart --version


      # ============================================================
      # VERIFY MAIN PROJECT
      # ============================================================

      - name: Verify Flutter project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FLUTTER PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "OK: pubspec.yaml"
          echo "OK: lib/main.dart"
          echo "OK: lib/firebase_options.dart"


      # ============================================================
      # VERIFY FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FIREBASE"
          echo "========================================"

          FIREBASE="android/app/google-services.json"

          if [ ! -f "$FIREBASE" ]; then
            echo "Firebase file is not available yet."
            echo "It will be restored after Android project creation."
          fi


      # ============================================================
      # BACKUP FIREBASE JSON
      # ============================================================

      - name: Backup Firebase configuration
        run: |
          set -e

          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Existing Firebase configuration backed up."
          else
            echo "No existing Android Firebase file found."
          fi


      # ============================================================
      # REMOVE BROKEN ANDROID PROJECT
      # ============================================================

      - name: Prepare Android project
        run: |
          set -e

          echo "========================================"
          echo "PREPARING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          echo "Fresh Android project created."


      # ============================================================
      # RESTORE FIREBASE JSON
      # ============================================================

      - name: Restore Firebase configuration
        run: |
          set -e

          echo "========================================"
          echo "RESTORING FIREBASE"
          echo "========================================"

          if [ ! -f "/tmp/google-services.json" ]; then
            echo "ERROR: Firebase configuration backup not found."
            exit 1
          fi

          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          echo "Firebase configuration restored."


      # ============================================================
      # CONFIGURE ANDROID PACKAGE
      # ============================================================

      - name: Configure Android package
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PACKAGE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]*"',
              'namespace = "com.friendpost.app"',
              text,
              count=1,
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]*"',
              'applicationId = "com.friend
