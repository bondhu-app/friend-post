name: Build Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # ---------------------------------------------------------
      # Create a completely fresh Flutter Android V2 project.
      # This removes every possible old Android V1 embedding file.
      # ---------------------------------------------------------
      - name: Rebuild Android project from Flutter V2 template
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Rebuilding Android project"
          echo "========================================"

          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Firebase configuration backed up."
          else
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.friendpost \
            --project-name friend_post \
            --android-language kotlin \
            .

          mkdir -p android/app

          cp /tmp/google-services.json android/app/google-services.json

          echo "Fresh Android V2 project created."
          echo "Firebase configuration restored."

      # ---------------------------------------------------------
      # Configure Google Services / Firebase
      # ---------------------------------------------------------
      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configuring Google Services"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          plugin_line = '    id("com.google.gms.google-services") version "4.4.3" apply false'

          if 'com.google.gms.google-services' not in text:
              marker = '    id("org.jetbrains.kotlin.android")'
              index = text.find(marker)

              if index != -1:
                  end = text.find('\n', index)
                  text = text[:end + 1] + plugin_line + '\n' + text[end + 1:]
              else:
                  plugins_index = text.find('plugins {')
                  if plugins_index == -1:
                      raise SystemExit("Could not find plugins block in settings.gradle.kts")

                  end = text.find('\n', plugins_index)
                  text = text[:end + 1] + plugin_line + '\n' + text[end + 1:]

              settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'com.google.gms.google-services' not in text:
              marker = '    id("dev.flutter.flutter-gradle-plugin")'
              index = text.find(marker)

              if index == -1:
                  marker = '    id("com.android.application")'
                  index = text.find(marker)

              if index == -1:
                  raise SystemExit("Could not find plugins block in app/build.gradle.kts")

              end = text.find('\n', index)
              text = text[:end + 1] + '    id("com.google.gms.google-services")\n' + text[end + 1:]

              app.write_text(text)

          print("Google Services configuration completed.")
          PY

      # ---------------------------------------------------------
      # Make sure Firebase configuration matches applicationId
      # ---------------------------------------------------------
      - name: Verify Android application configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying Android configuration"
          echo "========================================"

          grep -RIn \
            'applicationId\|namespace\|google-services' \
            android/app/build.gradle.kts \
            android/settings.gradle.kts \
            || true

          echo ""
          echo "Checking Firebase package name..."

          grep -q '"package_name": "com.friendpost.app"' \
            android/app/google-services.json

          echo "Firebase package name found."

      # ---------------------------------------------------------
      # ABSOLUTE V1 EMBEDDING CHECK
      # ---------------------------------------------------------
      - name: Check for legacy Android V1 embedding
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Android V1 embedding"
          echo "========================================"

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterView" \
            android; then

            echo ""
            echo "ERROR: Android V1 embedding reference found."
            echo "The Android project is NOT clean."
            exit 1
          fi

          echo ""
          echo "SUCCESS: No Android V1 embedding reference found."

      # ---------------------------------------------------------
      # Verify Android project files
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android project files"
          echo "========================================"

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/friendpost/friend_post/MainActivity.kt
          test -f android/app/google-services.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "All required Android files exist."

      # ---------------------------------------------------------
      # Flutter analysis
      # ---------------------------------------------------------
      - name: Analyze project
        run: flutter analyze

      # ---------------------------------------------------------
      # Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # ---------------------------------------------------------
      # Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
