name: Friend Post APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Friend Post
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source files
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FRIEND POST SOURCE"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/firebase_options.dart

          echo "Source files OK."

      - name: Generate Android project
        run: |
          set -e

          echo "========================================"
          echo "GENERATING ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name friend_post \
            --org com.friendpost \
            .

          echo ""
          echo "Android project generated."

          find android -maxdepth 3 -type f | sort

      - name: Configure application ID
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING APPLICATION ID"
          echo "========================================"

          if [ -f "android/app/build.gradle.kts" ]; then

            sed -i 's/com\.example\.friend_post/com.friendpost.app/g' \
              android/app/build.gradle.kts

            sed -i 's/com\.friendpost\.friend_post/com.friendpost.app/g' \
              android/app/build.gradle.kts

            echo "Kotlin Gradle file configured."

          elif [ -f "android/app/build.gradle" ]; then

            sed -i 's/com\.example\.friend_post/com.friendpost.app/g' \
              android/app/build.gradle

            sed -i 's/com\.friendpost\.friend_post/com.friendpost.app/g' \
              android/app/build.gradle

            echo "Gradle file configured."

          else
            echo "ERROR: Android app Gradle file not found."
            find android -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Create Firebase configuration
        run: |
          set -e

          echo "========================================"
          echo "CREATING FIREBASE CONFIGURATION"
          echo "========================================"

          mkdir -p android/app

          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1074705827775",
              "project_id": "friend-post-fbfdd",
              "storage_bucket": "friend-post-fbfdd.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1074705827775:android:68710467504787bc3a430a",
                  "android_client_info": {
                    "package_name": "com.friendpost.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAbYCTMxhCJzft1dgnpHDRkbC4v9RMU4GE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          echo "Firebase configuration created."

      - name: Configure Google Services
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GOOGLE SERVICES"
          echo "========================================"

          if [ -f "android/settings.gradle.kts" ]; then

            if ! grep -q "com.google.gms.google-services" \
              android/settings.gradle.kts; then

              sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.4" apply false' \
                android/settings.gradle.kts
            fi

            if ! grep -q "com.google.gms.google-services" \
              android/app/build.gradle.kts; then

              sed -i '/plugins {/a\    id("com.google.gms.google-services")' \
                android/app/build.gradle.kts
            fi

            echo "Google Services configured for Kotlin DSL."

          elif [ -f "android/settings.gradle" ]; then

            if ! grep -q "com.google.gms.google-services" \
              android/settings.gradle; then

              sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.4" apply false' \
                android/settings.gradle
            fi

            if ! grep -q "com.google.gms.google-services" \
              android/app/build.gradle; then

              sed -i '/plugins {/a\    id("com.google.gms.google-services")' \
                android/app/build.gradle
            fi

            echo "Google Services configured for Gradle."

          else
            echo "ERROR: settings.gradle file not found."
            find android -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Add Firebase packages
        run: |
          set -e

          echo "========================================"
          echo "ADDING FIREBASE PACKAGES"
          echo "========================================"

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

          flutter pub get

          echo "Firebase packages installed."

      - name: Show Android configuration
        run: |
          set -e

          echo "========================================"
          echo "ANDROID CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Android files:"
          find android -maxdepth 4 -type f | sort

          echo ""
          echo "Firebase file:"
          ls -lh android/app/google-services.json

      - name: Flutter analyze
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FRIEND POST APK"
          echo "========================================"

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friend-post-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
